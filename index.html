<style>
  html,body{

<body>
<div id="wrap"><canvas id="c" width="390" height="844"></canvas></div>
<button type="button" id="vibBtn" aria-pressed="true">震動 開</button>
<div id="hint"></div>
<div id="safeProbe" aria-hidden="true"></div>
<script>
/* ============================================================
   白雞跳跳 v0.2  — 難度與手感參數（調這裡即可）
   ------------------------------------------------------------
   關卡為什麼從「穿管子」改成「平台跳躍」：
   v0.1 是持續下落、連點拍翅穿過管子。蓄力必須在落地後按住再放開，
   空中長按只會一直掉下去，長短蓄力也對不到「要過哪一個缺口」。
   改成自動向前的平台關後，短按過近台、長按過遠台或高跳，蓄力才有意義。
   ============================================================ */
const CFG = {
  W: 390,
  H: 844,
  // 物理（單位：像素、秒）。模擬用固定 60 tick，避免幀率影響跳高。
  TICK: 1 / 60,
  GRAVITY: 2200,        // 上升重力
  FALL_GRAVITY_MUL: 1.8, // 下落重力倍數（較不漂）
  MAX_FALL: 1400,       // 下落速度上限
  JUMP_VY_MIN: 640,     // 輕點的最小起跳速度（向上）
  JUMP_VY_MAX: 1200,    // 蓄滿的最大起跳速度
  CHARGE_MS: 750,       // 蓄滿所需時間
  RUN_SPEED: 230,       // 水平速度；蓄力時仍會向前跑
  CHICKEN_R: 18,
  COYOTE_S: 0.10,       // 走下平台後仍可起跳的寬限
  JUMP_BUFFER_S: 0.12,  // 落地前短按，落地後仍起跳
  SHAKE_DECAY: 1.2,
  CAM_LOOK: 48,         // 鏡頭向跑向預視
  CAM_FOLLOW: 8,        // 鏡頭追及速率（指數平滑）
  LAND_SQUASH: 0.18,
  COUNTDOWN_S: 3,      // 開始與重開前的倒數秒數（會顯示 3、2、1）
  // 放開起跳的即時回饋（不改最小／最大起跳速度，以保留短長跳高度差）
  JUMP_LAUNCH_DT: 1 / 60, // 放開當下立刻跑完的物理步長（與 TICK 相同，不額外加跳高）
  JUMP_STRETCH: 0.34,     // 彈起伸展幅度
  JUMP_STRETCH_S: 0.14,   // 伸展持續秒數
  JUMP_DUST: 8,           // 起跳粉塵顆數
  JUMP_TRAIL: 5,          // 上升時的拖影段數
  // 平台
  PLAT_THICK: 24,
  PLAT_Y_MIN: 360,
  PLAT_Y_MAX: 640,
  START_W: 250,
  START_Y: 580,
  DEATH_Y: 920,
  LOOKAHEAD: 8,
  // 間距：與同高飛距對齊（下落重力 1.8 倍後，短跳約 104px，滿蓄約 195px）
  GAP_SHORT: [70, 92],
  GAP_MID:   [108, 138],
  GAP_LONG:  [152, 182],
  WIDTH_SAFE:   [130, 190],
  WIDTH_NARROW: [74, 98],
  STEP_UP:   [36, 70],
  STEP_DOWN: [40, 90],
  // 畫面：以高度 844 為基準，寬度隨可視區域延伸。CAM_X 是設計寬 390 時雞距左緣的位置。
  CAM_X: 110,
  VIEW_AHEAD: 280,   // 雞前方固定可視距離（與設計寬 390-110 相同，畫面變寬不加看前方）
  MAX_ASPECT: 2,     // 世界鏡頭最大寬高比；更寬的螢幕只向左延伸天空／山／地面，不加看前方
  // ---- 天氣與環境物理（世界尺度由地球 g 對齊：2200 px/s² = 9.81 m/s²）----
  G_EARTH: 9.81,      // m/s²，地球標準重力
  G_MOON: 1.62,       // m/s²，月球表面重力
  G_MARS: 3.71,       // m/s²，火星表面重力
  RHO0: 1.225,        // kg/m³，海平面 15°C 的 ISA 空氣密度
  RHO_HOT: 1.127,     // kg/m³，40°C 同壓下 ρ∝1/T，288.15/313.15×1.225
  RHO_MARS: 0.020,    // kg/m³，火星近地表平均密度
  // 拖曳：F_d = ½ ρ C_d A |v_rel| v_rel，方向與相對空速相反（拖曳力方程式）
  DRAG_CD: 0.47,      // 近似球形／蓬鬆身體的阻力係數
  DRAG_AREA: 0.05,    // m²，迎風面積
  DRAG_MASS: 1.5,     // kg，一隻雞的量級
  MU_DRY: 0.70,       // 乾草地／土的動摩擦係數
  MU_WET: 0.35,       // 濕滑
  MU_ICE: 0.10,       // 結冰；地面減速 a = μ g
  MU_REGOLITH: 0.40,  // 月表風化層
  RAIN_VTERM: 9,      // m/s，雨滴終端速度量級
  SNOW_VTERM: 1,      // m/s，雪花終端速度量級
  WX_PARTICLES: 90,   // 雨／雪／風線基準顆數（實際數量隨 FX 品質縮放）
  GAP_REACH: 0.86,    // 用最大飛距的這一比例當長缺口上限，保證可過
  GAP_SHORT_REACH: 0.82, // 短缺口相對於最小跳飛距
  ICE_WIDTH_MUL: 1.25,
  // ---- 天氣視覺（質感對齊 iPhone 天氣 App／動態桌布；不影響物理與公平性）----
  FX_QUALITY: 'auto',     // auto | high | medium | low；也可 ?fx=low
  FX_MAX_DPR_HIGH: 2.5,
  FX_MAX_DPR_LOW: 1.5,
  FX_TOD: true,           // 依台北時間做晨昏夜色調，只改視覺
  FX_HAZE: true,          // 高溫熱浪：只扭天空，不扭雞與平台
  FX_LIGHTNING: true,     // 暴風雨偶發閃電（無雷聲）
  WX_RAIN_BG: 48,
  WX_RAIN_FG: 36,
  WX_SNOW: 64,
  WX_DUST: 36,
  WX_DROPLETS: 11,        // 鏡頭玻璃水珠
  WX_CLOUD_FAR: 5,
  WX_CLOUD_MID: 5,
  WX_CLOUD_NEAR: 4
};

// ---- 每日種子：台北時間（Asia/Taipei）的年月日 ----
function taipeiSeed() {
  const iso = new Intl.DateTimeFormat('en-CA', {
    timeZone: 'Asia/Taipei',
    year: 'numeric', month: '2-digit', day: '2-digit'
  }).format(new Date());
  return Number(iso.replace(/-/g, ''));
}
function taipeiDateLabel(seed) {
  const s = String(seed);
  return s.slice(0, 4) + '-' + s.slice(4, 6) + '-' + s.slice(6, 8);
}

const SEED0 = taipeiSeed();
const BEST_KEY = 'baijiBest.v02.' + SEED0;
const VIB_KEY = 'baijiVibrate.v02';
const URL_PARAMS = new URLSearchParams((location.search || '').replace(/^\?/, ''));
const DEBUG = URL_PARAMS.get('debug') === '1';
const WEATHER_FORCE = (URL_PARAMS.get('weather') || '').toLowerCase().trim();
const FX_FORCE = (URL_PARAMS.get('fx') || '').toLowerCase().trim();
const TOD_FORCE = (URL_PARAMS.get('tod') || '').toLowerCase().trim();

/* ============================================================
   天氣與環境物理
   尺度：CFG.GRAVITY（2200 px/s²）對齊地球 g=9.81 m/s²，
   因此 1 m = GRAVITY/G_EARTH ≈ 224.3 px。此尺度不隨天體改變；
   月球／火星日只改 g 的比例。每日（台北日期）種子決定天氣，
   同一天所有人條件相同。?weather=id 可強制指定（例如 moon）。
   ============================================================ */
function pxPerM() { return CFG.GRAVITY / CFG.G_EARTH; }
function seedHash(n) {
  let x = (n >>> 0) ^ 0xA5A5A5A5;
  x = Math.imul(x ^ (x >>> 16), 0x7feb352d);
  x = Math.imul(x ^ (x >>> 15), 0x846ca68b);
  return (x ^ (x >>> 16)) >>> 0;
}
function mulberry32(a) {
  return function () {
    a |= 0;
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// 天氣清單：id 供 ?weather= 使用
const WEATHER_IDS = ['clear','tailwind','headwind','gusty','rain','storm','ice','snow','hot','moon','mars'];

function buildWeather(id, seed) {
  const rndw = mulberry32(seedHash(seed ^ 0x9E3779B9 ^ seedHash(id.length * 13 + id.charCodeAt(0))));
  const range = (a, b) => a + rndw() * (b - a);
  const gE = CFG.G_EARTH;
  const rho0 = CFG.RHO0;
  const base = {
    id: id,
    gMul: 1,
    rho: rho0,
    mu: CFG.MU_DRY,
    precip: '',
    windBaseMs: 0,
    gustAmpMs: 0,
    gustLambda: 900,
    gustPhase: 0,
    segments: [],
    palette: 'earth'
  };
  if (id === 'clear') {
    base.title = '晴朗';
    base.emoji = '☀️';
  } else if (id === 'tailwind') {
    base.title = '順風';
    base.emoji = '🌬️';
    base.windBaseMs = range(3, 7);
    base.palette = 'wind';
  } else if (id === 'headwind') {
    base.title = '逆風';
    base.emoji = '🌬️';
    base.windBaseMs = -range(3, 7);
    base.palette = 'wind';
  } else if (id === 'gusty') {
    base.title = '陣風';
    base.emoji = '💨';
    base.windBaseMs = range(-2, 2);
    base.gustAmpMs = range(3, 6);
    base.gustLambda = range(700, 1400);
    base.gustPhase = range(0, Math.PI * 2);
    // 種子決定的鋒面：關卡中改變平均風向
    let x = 0;
    base.segments = [];
    for (let i = 0; i < 3; i++) {
      x += (i === 0 ? 0 : range(700, 1300));
      const dir = rndw() < 0.5 ? -1 : 1;
      base.segments.push({ fromX: x, windMs: dir * range(2, 6) });
    }
    base.palette = 'wind';
  } else if (id === 'rain') {
    base.title = '降雨';
    base.emoji = '🌧️';
    base.mu = CFG.MU_WET;
    base.precip = 'rain';
    base.windBaseMs = range(-2, 3);
    base.palette = 'rain';
  } else if (id === 'storm') {
    base.title = '暴風雨';
    base.emoji = '⛈️';
    base.mu = CFG.MU_WET;
    base.precip = 'rain';
    base.windBaseMs = -range(7, 11);
    base.gustAmpMs = range(2, 4);
    base.gustLambda = range(500, 900);
    base.gustPhase = range(0, Math.PI * 2);
    let x = 0;
    base.segments = [];
    for (let i = 0; i < 3; i++) {
      x += (i === 0 ? 0 : range(600, 1100));
      base.segments.push({ fromX: x, windMs: -range(6, 12) });
    }
    base.palette = 'storm';
  } else if (id === 'ice') {
    base.title = '路面結冰';
    base.emoji = '🧊';
    base.mu = CFG.MU_ICE;
    base.precip = 'snow';
    base.windBaseMs = range(-1.5, 2);
    base.palette = 'ice';
  } else if (id === 'snow') {
    base.title = '降雪';
    base.emoji = '❄️';
    base.mu = (CFG.MU_WET + CFG.MU_ICE) * 0.5; // 約 0.225，積雪濕滑
    base.precip = 'snow';
    base.windBaseMs = range(-2, 4);
    base.palette = 'snow';
  } else if (id === 'hot') {
    base.title = '高溫';
    base.emoji = '🔥';
    base.rho = CFG.RHO_HOT;
    base.windBaseMs = range(0, 2);
    base.palette = 'hot';
  } else if (id === 'moon') {
    // 月球幾乎真空，無氣動拖曳；g_moon/g_earth = 1.62/9.81
    base.title = '月球日';
    base.emoji = '🌙';
    base.gMul = CFG.G_MOON / gE;
    base.rho = 0;
    base.mu = CFG.MU_REGOLITH;
    base.windBaseMs = 0;
    base.palette = 'moon';
  } else if (id === 'mars') {
    base.title = '火星日';
    base.emoji = '🔴';
    base.gMul = CFG.G_MARS / gE;
    base.rho = CFG.RHO_MARS;
    base.mu = 0.55;
    base.windBaseMs = range(8, 16); // 火星風速可高，但空氣極稀薄，氣動力很小
    base.gustAmpMs = range(2, 5);
    base.gustLambda = range(800, 1500);
    base.gustPhase = range(0, Math.PI * 2);
    base.palette = 'mars';
  } else {
    base.title = '晴朗';
    base.emoji = '☀️';
    base.id = 'clear';
  }
  return base;
}

function chooseWeatherId(seed) {
  if (WEATHER_FORCE && WEATHER_IDS.indexOf(WEATHER_FORCE) >= 0) return WEATHER_FORCE;
  return WEATHER_IDS[seedHash(seed) % WEATHER_IDS.length];
}

function windWords(ms) {
  const a = Math.abs(ms);
  if (a < 0.4) return '';
  const n = a >= 10 ? a.toFixed(0) : a.toFixed(1);
  return (ms > 0 ? '順風 ' : '逆風 ') + n + ' m/s';
}

function weatherLines(w, env) {
  const lines = [];
  if (w.id === 'moon') {
    lines.push(w.emoji + ' 月球重力 ' + w.gMul.toFixed(2) + 'g');
  } else if (w.id === 'mars') {
    lines.push(w.emoji + ' 火星重力 ' + w.gMul.toFixed(2) + 'g');
    const ww = windWords(env.windMs);
    if (ww) lines.push('稀薄大氣　' + ww);
  } else if (w.id === 'hot') {
    const ratio = w.rho / CFG.RHO0;
    lines.push(w.emoji + ' 高溫　空氣密度 ' + ratio.toFixed(2) + ' ρ₀');
    const ww = windWords(env.windMs);
    if (ww) lines.push('🌬️ ' + ww);
  } else if (w.id === 'ice') {
    lines.push(w.emoji + ' 路面結冰　μ=' + w.mu.toFixed(2));
    const ww = windWords(env.windMs);
    if (ww) lines.push('🌬️ ' + ww);
  } else if (w.id === 'rain' || w.id === 'storm' || w.id === 'snow') {
    const ww = windWords(env.windMs);
    lines.push(w.emoji + ' ' + w.title + (ww ? '　' + ww : ''));
    lines.push('濕滑 μ=' + w.mu.toFixed(2));
  } else if (w.id === 'gusty') {
    const ww = windWords(env.windMs);
    lines.push(w.emoji + ' 陣風' + (ww ? '　目前' + ww : ''));
  } else {
    const ww = windWords(env.windMs);
    if (ww) lines.push(w.emoji + ' ' + ww);
    else lines.push(w.emoji + ' ' + w.title);
  }
  return lines;
}

let weather = null;
let wxParts = [];
let wxStars = [];

function initWeather(seed, forceId) {
  const id = forceId || chooseWeatherId(seed);
  weather = buildWeather(id, seed);
  wxParts = [];
  wxStars = [];
  nightStars = [];
  wxParts = [];
  glassDrops = [];
  lightningT = 0;
  lightningNext = 3 + (seed % 5);
  skyCache.key = '';
  rebuildSprites();
  ensureStars();
}

function envAt(x) {
  const w = weather;
  let windMs = w.windBaseMs;
  if (w.segments && w.segments.length) {
    for (let i = 0; i < w.segments.length; i++) {
      if (x >= w.segments[i].fromX) windMs = w.segments[i].windMs;
    }
  }
  if (w.gustAmpMs) {
    windMs += w.gustAmpMs * Math.sin(x / w.gustLambda + w.gustPhase);
  }
  return {
    gMul: w.gMul,
    rho: w.rho,
    mu: w.mu,
    precip: w.precip,
    windMs: windMs,
    windPx: windMs * pxPerM(),
    palette: w.palette
  };
}

// 為保持跳高，初速依 v=√(2gh) 隨 √g 縮放（h 固定時 v ∝ √g）
function jumpSpeed(charge) {
  const t = Math.max(0, Math.min(1, charge));
  const base = CFG.JUMP_VY_MIN + t * (CFG.JUMP_VY_MAX - CFG.JUMP_VY_MIN);
  return base * Math.sqrt(weather.gMul);
}

// 空氣動力學：a_drag = −(½ C_d A / m) ρ |v_rel| v_rel
// 寫成像素：a_px = −K ρ |v_px| v_px / (px/m)，K = ½ C_d A / m
function applyAirTo(s, dt) {
  const env = envAt(s.x);
  const g = CFG.GRAVITY * env.gMul;
  const gUse = s.vy > 0 ? g * CFG.FALL_GRAVITY_MUL : g;
  const relX = s.vx - env.windPx;
  const relY = s.vy; // 風視為水平
  const rel = Math.hypot(relX, relY);
  const K = 0.5 * CFG.DRAG_CD * CFG.DRAG_AREA / CFG.DRAG_MASS;
  const ppm = pxPerM();
  if (rel > 1e-6 && env.rho > 1e-8) {
    const mul = (K * env.rho * rel) / ppm;
    s.vx -= mul * relX * dt;
    s.vy -= mul * relY * dt;
  }
  s.vy += gUse * dt;
  if (env.rho > 1e-8) {
    // 終端速度 v_t = √(2 m g / (ρ C_d A))，只限制下落
    const vt = Math.sqrt((CFG.DRAG_MASS * (gUse / ppm)) / (0.5 * env.rho * CFG.DRAG_CD * CFG.DRAG_AREA + 1e-12)) * ppm;
    if (s.vy > 0) s.vy = Math.min(s.vy, vt);
  } else if (s.vy > CFG.MAX_FALL * 3) {
    s.vy = CFG.MAX_FALL * 3;
  }
}

function simJumpTo(charge, x0, y0, vx0, platY) {
  const s = { x: x0, y: y0, vx: vx0, vy: -jumpSpeed(charge) };
  let prevY = s.y;
  const dt = CFG.TICK;
  const R = CFG.CHICKEN_R;
  let peak = 0;
  for (let i = 0; i < 720; i++) {
    applyAirTo(s, dt);
    s.x += s.vx * dt;
    const newY = s.y + s.vy * dt;
    peak = Math.max(peak, y0 - Math.min(newY, s.y));
    if (s.vy >= 0) {
      const feet0 = prevY + R;
      const feet1 = newY + R;
      if (feet0 <= platY + 4 && feet1 >= platY) {
        return { x: s.x, y: platY - R, landed: true, peak: peak, steps: i + 1 };
      }
    }
    s.y = newY;
    prevY = s.y;
    if (s.y > CFG.DEATH_Y) break;
  }
  return { x: s.x, y: s.y, landed: false, peak: peak, steps: 0 };
}

function jumpReach(charge, y0, platY, x0) {
  const r = simJumpTo(charge, x0, y0, CFG.RUN_SPEED, platY);
  return r.x - x0;
}

function fitGap(kind, rawGap, prev, nextY) {
  const x0 = prev.x + prev.w - 8;
  const y0 = prev.y - CFG.CHICKEN_R;
  let r0 = jumpReach(0, y0, nextY, x0);
  let r1 = jumpReach(1, y0, nextY, x0);
  if (r1 < r0) { const t = r0; r0 = r1; r1 = t; }
  // 低重力等飛距變長時，短／中／長缺口都按可達距離等比放大，避免最小跳就越過下一台
  const shortHi = Math.max(36, r0 * CFG.GAP_SHORT_REACH);
  const longHi = Math.max(shortHi + 12, r1 * CFG.GAP_REACH);
  const midLo = Math.min(r0 * 1.05, longHi * 0.72);
  const midHi = Math.max(midLo + 8, longHi * 0.78);
  const longLo = Math.min(Math.max(midHi + 6, r0 * 1.10), longHi * 0.96);
  function band(lo, hi, raw, rawLo, rawHi) {
    let u = (raw - rawLo) / Math.max(1e-6, rawHi - rawLo);
    u = Math.max(0, Math.min(1, u));
    return lo + u * Math.max(0, hi - lo);
  }
  let gap;
  if (kind === 'short') {
    gap = band(shortHi * 0.72, shortHi, rawGap, CFG.GAP_SHORT[0], CFG.GAP_SHORT[1]);
  } else if (kind === 'mid') {
    gap = band(midLo, midHi, rawGap, CFG.GAP_MID[0], CFG.GAP_MID[1]);
  } else if (kind === 'long') {
    gap = band(longLo, longHi, rawGap, CFG.GAP_LONG[0], CFG.GAP_LONG[1]);
  } else {
    gap = band(midLo, midHi, rawGap, CFG.GAP_MID[0] - 16, CFG.GAP_MID[1] - 10);
  }
  if (!(gap > 0)) gap = shortHi;
  return Math.max(28, gap);
}

function canLandOn(prev, next) {
  const y0 = prev.y - CFG.CHICKEN_R;
  const tries = [0, 0.12, 0.25, 0.4, 0.55, 0.7, 0.85, 1];
  const takeoffs = [prev.x + prev.w - 8];
  const mid = prev.x + prev.w * 0.55;
  if (mid < takeoffs[0] - 10) takeoffs.push(mid);
  takeoffs.push(prev.x + Math.min(40, prev.w * 0.3));
  for (let t = 0; t < takeoffs.length; t++) {
    const x0 = Math.max(prev.x + 8, takeoffs[t]);
    for (let i = 0; i < tries.length; i++) {
      const r = simJumpTo(tries[i], x0, y0, CFG.RUN_SPEED, next.y);
      if (r.landed && r.x + 8 >= next.x && r.x - 8 <= next.x + next.w) {
        return { ok: true, charge: tries[i], takeoffX: x0, landX: r.x };
      }
    }
    // 若最小跳已超過平台，再往前提起跳點
    const over = simJumpTo(0, x0, y0, CFG.RUN_SPEED, next.y);
    if (over.landed && over.x - 8 > next.x + next.w) continue;
    // 二分蓄力找可落點
    let lo = 0, hi = 1, ok = null;
    for (let k = 0; k < 10; k++) {
      const midc = (lo + hi) / 2;
      const r = simJumpTo(midc, x0, y0, CFG.RUN_SPEED, next.y);
      if (r.landed && r.x + 8 >= next.x && r.x - 8 <= next.x + next.w) { ok = r; ok.charge = midc; break; }
      if (!r.landed || r.x + 8 < next.x) lo = midc;
      else hi = midc;
    }
    if (ok) return { ok: true, charge: ok.charge, takeoffX: x0, landX: ok.x };
  }
  return { ok: false };
}

function detectFxQuality() {
  if (FX_FORCE === 'high' || FX_FORCE === 'medium' || FX_FORCE === 'low') {

  }
  if (CFG.FX_QUALITY && CFG.FX_QUALITY !== 'auto') {

  }
  fxAuto = true;
  const cores = navigator.hardwareConcurrency || 4;
  const mem = navigator.deviceMemory || 4;

}
fxQuality = detectFxQuality();
function fxMul() {

function fxMaxDpr() {

function noteFrame(dt) {

  frameSamples.push(ms);
  if (frameSamples.length > 90) frameSamples.shift();
  if (frameSamples.length >= 20) {
    const avg = frameSamples.reduce((a, b) => a + b, 0) / frameSamples.length;
    fxFrameMs = avg;
    fxFps = avg > 0.1 ? 1000 / avg : 60;
  }
  if (fxAuto && !fxDowngraded && frameSamples.length >= 75) {
    const avg = frameSamples.reduce((a, b) => a + b, 0) / frameSamples.length;
    if (avg > 22) {
      const order = ['high', 'medium', 'low'];
      const i = order.indexOf(fxQuality);
      if (i >= 0 && i < order.length - 1) {
        fxQuality = order[i + 1];
        fxDowngraded = true;

  }
}

function taipeiHourFloat() {
  if (TOD_FORCE) {
    const map = { dawn: 6, morning: 8.5, noon: 12.5, golden: 17, sunset: 18.4, dusk: 19.8, night: 22 };
    if (map[TOD_FORCE] != null) return map[TOD_FORCE];
  }
  try {
    const parts = new Intl.DateTimeFormat('en-GB', {
      timeZone: 'Asia/Taipei', hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
    }).formatToParts(new Date());
    const h = Number((parts.find(p => p.type === 'hour') || {}).value || 12);
    const m = Number((parts.find(p => p.type === 'minute') || {}).value || 0);
    return h + m / 60;
  } catch (e) {
    return 12;
  }
}
function todPhase() {
  if (!CFG.FX_TOD) return { id: 'noon', hour: 12 };

  let id = 'night';
  if (h >= 5 && h < 7) id = 'dawn';
  else if (h >= 7 && h < 10) id = 'morning';
  else if (h >= 10 && h < 16) id = 'noon';
  else if (h >= 16 && h < 17.6) id = 'golden';

function makeOffscreen(w, h) {

  c.width = Math.max(1, w);
  c.height = Math.max(1, h);
  return c;
}
function ensureSkyCache() {
  const key = [weather && weather.id, todPhase().id, fxQuality].join('|');
  if (skyCache.key === key && skyCache.canvas) return skyCache.canvas;
  const c = makeOffscreen(8, 256);
  const g = c.getContext('2d');
  const grd = g.createLinearGradient(0, 0, 0, 256);
  const stops = skyStops();
  for (let i = 0; i < stops.length; i++) grd.addColorStop(stops[i][0], stops[i][1]);
  g.fillStyle = grd;
  g.fillRect(0, 0, 8, 256);

}
function makeSoftBlobSprite(rgb, size, layers) {
  const c = makeOffscreen(size, Math.round(size * 0.62));
  const g = c.getContext('2d');
  const r = mulberry32(rgb[0] * 17 + size * 13 + layers * 9);
  for (let i = 0; i < layers; i++) {
    const x = size * (0.18 + r() * 0.64);
    const y = c.height * (0.32 + r() * 0.36);
    const rad = size * (0.16 + r() * 0.22);
    const grd = g.createRadialGradient(x, y, 0, x, y, rad);
    const a0 = 0.42 + r() * 0.2;
    grd.addColorStop(0, 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + a0 + ')');
    grd.addColorStop(0.5, 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + (a0 * 0.4) + ')');
    grd.addColorStop(1, 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',0)');
    g.fillStyle = grd;
    g.beginPath();

function ensureStars() {

function spawnWxPart(kind, W, H, anywhere) {
  const z = Math.random();
  return {
    kind: kind,
    x: Math.random() * (W + 100) - 50,
    y: anywhere ? Math.random() * H : -30 - Math.random() * 40,
    z: z,
    a: 0.3 + Math.random() * 0.4,
    s: 0.6 + Math.random() * 1.1,
    wob: Math.random() * Math.PI * 2,
    wobs: 0.6 + Math.random() * 1.4

}
function wxBudget() {
  if (!weather) return { rainBg: 0, rainFg: 0, snow: 0, dust: 0 };
  if (weather.precip === 'rain') {
    const storm = weather.id === 'storm';
    return {
      rainBg: fxCount(CFG.WX_RAIN_BG * (storm ? 1.15 : 1)),
      rainFg: fxCount(CFG.WX_RAIN_FG * (storm ? 1.15 : 1)),
      snow: 0, dust: 0

  }
  if (weather.precip === 'snow') return { rainBg: 0, rainFg: 0, snow: fxCount(CFG.WX_SNOW), dust: 0 };
  if (weather.palette === 'mars') return { rainBg: 0, rainFg: 0, snow: 0, dust: fxCount(CFG.WX_DUST) };
  return { rainBg: 0, rainFg: 0, snow: 0, dust: 0 };
}
function updateWx(dt) {
  if (!weather) return;
  wxTime += dt;
  const W = viewW, H = viewH;
  const env = envAt((typeof camX === 'number' ? camX : 0) + (typeof camW === 'number' ? camW * 0.5 : 200));
  // 雲緩緩跟隨風向（比真實風速慢很多，只做氣氛）
  cloudDrift += (env.windMs * 3.2) * dt;
  const bud = wxBudget();
  const want = [];
  for (let i = 0; i < bud.rainBg; i++) want.push('rainBg');
  for (let i = 0; i < bud.rainFg; i++) want.push('rainFg');
  for (let i = 0; i < bud.snow; i++) want.push('snow');
  for (let i = 0; i < bud.dust; i++) want.push('dust');
  if (wxParts.length && want.length && wxParts[0].kind !== want[0] && !(wxParts[0].kind && want.indexOf(wxParts[0].kind) >= 0)) {
    wxParts = [];
  }
  while (wxParts.length < want.length) {
    wxParts.push(spawnWxPart(want[wxParts.length], W, H, true));
  }
  while (wxParts.length > want.length) wxParts.pop();
  const ppm = pxPerM();
  const wind = env.windPx;
  for (let i = 0; i < wxParts.length; i++) {
    const p = wxParts[i];
    p.wob += dt * p.wobs;
    if (p.kind === 'rainBg' || p.kind === 'rainFg') {
      const depth = p.kind === 'rainBg' ? 0.82 : 1;
      p.vy = CFG.RAIN_VTERM * ppm * depth;
      p.vx = wind * depth;
    } else if (p.kind === 'snow') {
      const depth = 0.45 + p.z * 0.55;
      p.vy = CFG.SNOW_VTERM * ppm * depth;
      p.vx = wind * (0.7 + p.z * 0.3) + Math.sin(p.wob) * 18;
    } else {
      p.vy = 36 + Math.abs(wind) * 0.02;
      p.vx = wind * 0.32 + Math.sin(p.wob) * 10;
    }
    p.x += (p.vx || 0) * dt;
    p.y += (p.vy || 0) * dt;
    if (p.y > H + 40 || p.x < -90 || p.x > W + 90) {
      p.x = Math.random() * (W + 100) - 50;
      p.y = -30 - Math.random() * 40;
    }
  }
  // 玻璃水珠（只在雨天，數量很少）
  const dropN = (weather.precip === 'rain') ? fxCount(CFG.WX_DROPLETS) : 0;
  while (glassDrops.length < dropN) {
    glassDrops.push({
      x: Math.random() * W,
      y: Math.random() * H * 0.7,
      r: 2.2 + Math.random() * 3.4,
      vy: 14 + Math.random() * 28,
      trail: 0
    });
  }
  while (glassDrops.length > dropN) glassDrops.pop();
  for (let i = 0; i < glassDrops.length; i++) {
    const d = glassDrops[i];
    d.vy = Math.min(70, d.vy + dt * 8);
    d.y += d.vy * dt;
    d.x += wind * 0.012 * dt;
    d.trail = Math.min(22, d.trail + d.vy * dt * 0.35);
    if (d.y > H + 10) {
      d.x = Math.random() * W;
      d.y = -8;
      d.r = 2.2 + Math.random() * 3.4;
      d.vy = 12 + Math.random() * 18;
      d.trail = 0;
    }
  }
  if (weather.id === 'storm' && CFG.FX_LIGHTNING) {
    lightningNext -= dt;
    if (lightningT > 0) lightningT = Math.max(0, lightningT - dt * 3.4);
    if (lightningNext <= 0) {
      lightningT = 1;
      lightningNext = 2.8 + Math.random() * 7;

  }
}

let viewW = CFG.W, viewH = CFG.H, camW = CFG.W, viewPadX = 0, viewScale = 1;

function viewportCss() {
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) {
    return { w: vv.width, h: vv.height, left: vv.offsetLeft || 0, top: vv.offsetTop || 0 };
  }
  return { w: window.innerWidth || CFG.W, h: window.innerHeight || CFG.H, left: 0, top: 0 };
}
function measureSafeCss(vp) {
  if (!safeProbe) return { t: 0, r: 0, b: 0, l: 0 };
  const r = safeProbe.getBoundingClientRect();
  return {
    t: Math.max(0, r.top - vp.top),
    l: Math.max(0, r.left - vp.left),
    r: Math.max(0, (vp.left + vp.w) - r.right),
    b: Math.max(0, (vp.top + vp.h) - r.bottom)

}
function layout() {
  const vp = viewportCss();
  const cssW = Math.max(1, vp.w);
  const cssH = Math.max(1, vp.h);
  const dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, fxMaxDpr()));
  wrapEl.style.left = vp.left + 'px';
  wrapEl.style.top = vp.top + 'px';
  wrapEl.style.width = cssW + 'px';
  wrapEl.style.height = cssH + 'px';
  const bw = Math.max(1, Math.round(cssW * dpr));
  const bh = Math.max(1, Math.round(cssH * dpr));
  if (canvas.width !== bw || canvas.height !== bh) {
    canvas.width = bw;
    canvas.height = bh;
  }
  viewH = CFG.H;
  viewScale = cssH / viewH;
  viewW = canvas.width / (canvas.height / viewH);
  camW = Math.min(viewW, viewH * CFG.MAX_ASPECT);
  viewPadX = Math.max(0, viewW - camW);
  safeCss = measureSafeCss(vp);
  if (chick) updateCam();
}

    t: safeCss.t / s,
    r: safeCss.r / s,

  trauma = Math.max(0, trauma - CFG.SHAKE_DECAY * realDt);

function pickKind(progress) {
  // 越後面越常出現長距、落差與窄台
  const p = Math.min(1, progress / 18);
  const r = rnd();
  if (r < 0.42 - p * 0.18) return 'short';
  if (r < 0.78 - p * 0.12) return 'mid';
  if (r < 0.92) return 'long';
  return 'up';
}

function ensurePlats() {
  while (plats.length && plats[0].x + plats[0].w < camX - 80) plats.shift();
  while (plats.length < CFG.LOOKAHEAD) {
    const prev = plats[plats.length - 1];
    const late = prev.id > 8;
    let gap, w, y, kind;
    // 前兩個缺口固定好過，並讓開場就看得到第一個缺口
    if (prev.id === 1) {
      kind = 'short';
      gap = randRange(CFG.GAP_SHORT[0], CFG.GAP_SHORT[1]);
      w = randRange(220, 260);
      y = prev.y + randRange(-8, 8);
    } else if (prev.id === 2) {
      kind = 'mid';
      gap = randRange(CFG.GAP_MID[0], CFG.GAP_MID[1] - 8);
      w = randRange(150, 190);
      y = prev.y + randRange(-16, 10);
    } else {
    kind = pickKind(prev.id - 1);
    if (kind === 'short') {
      gap = randRange(CFG.GAP_SHORT[0], CFG.GAP_SHORT[1]);
      w = late && rnd() < 0.45
        ? randRange(CFG.WIDTH_NARROW[0], CFG.WIDTH_NARROW[1])
        : randRange(CFG.WIDTH_SAFE[0], CFG.WIDTH_SAFE[1]);
      y = prev.y + randRange(-12, 12);
    } else if (kind === 'mid') {
      gap = randRange(CFG.GAP_MID[0], CFG.GAP_MID[1]);
      w = randRange(CFG.WIDTH_SAFE[0], CFG.WIDTH_SAFE[1]);
      y = prev.y + (rnd() < 0.5 ? randRange(-20, 20) : 0);
    } else if (kind === 'long') {
      gap = randRange(CFG.GAP_LONG[0], CFG.GAP_LONG[1]);
      w = randRange(CFG.WIDTH_SAFE[0], CFG.WIDTH_SAFE[1] + 20);
      y = prev.y + randRange(0, CFG.STEP_DOWN[1] * 0.4);
    } else {
      gap = randRange(CFG.GAP_MID[0] - 16, CFG.GAP_MID[1] - 10);
      w = randRange(CFG.WIDTH_SAFE[0], CFG.WIDTH_SAFE[1]);
      y = prev.y - randRange(CFG.STEP_UP[0], CFG.STEP_UP[1]);
    }
    y = Math.max(CFG.PLAT_Y_MIN, Math.min(CFG.PLAT_Y_MAX, y));

}

  chick.vy = -vy;
  lastJump = { vy: vy, charge: t, peak: 0, airborne: true, startY: chick.y };
  stretchT = CFG.JUMP_STRETCH_S;
  spawnJumpDust();
  haptic('jump');
  // 若不在物理步內，立刻跑完一步並重繪，讓放開當幀位置就上升
  if (!inStep) {
    acc -= CFG.JUMP_LAUNCH_DT;
    step(CFG.JUMP_LAUNCH_DT);
    draw();
  }
}

function findPlatUnder(px, feetY, slop) {
  for (let i = 0; i < plats.length; i++) {
    const p = plats[i];
    if (px + 8 >= p.x && px - 8 <= p.x + p.w && feetY >= p.y - slop && feetY <= p.y + 18) return p;
  }
  return null;
}

function landOn(p) {
  chick.y = p.y - CFG.CHICKEN_R;
  chick.vy = 0;
  grounded = true;
  lastGroundTick = tick;
  if (lastJump.airborne) {
    lastJump.peak = Math.max(lastJump.peak, lastJump.startY - chick.y);
    lastJump.airborne = false;
    squashT = CFG.LAND_SQUASH;
  }
  if (p.id !== onPlatId && p.id > lastScoredId) {
    score += 1;
    lastScoredId = p.id;
    haptic('score');
  }
  onPlatId = p.id;
  if (isHeld() && !charging) {
    charging = true;
    charge = 0;
    chargedFull = false;
    bufferedJump = false;
  } else if (bufferedJump && tick - lastPressTick <= BUFFER_TICKS) {
    charging = true;
    charge = Math.max(0, Math.min(1, bufferedCharge));
    bufferedJump = false;
    releaseJump();
  } else {
    charging = false;
    charge = 0;
    bufferedJump = false;
  }
}

function die() {
  if (st === 'over') return;
  charging = false;
  charge = 0;
  st = 'over';
  tOver = 0;
  haptic('hit');
  if (score > best) {
    best = score;
    localStorage.setItem(BEST_KEY, String(best));
  }
}

function step(dt) {
  inStep = true;
  try { stepBody(dt); } finally { inStep = false; }
}
function stepBody(dt) {
  if (st === 'over') { tOver += dt; return; }
  if (st === 'countdown') {
    countT += dt;
    countElapsed += dt;
    const secs = Math.max(0, Math.round(CFG.COUNTDOWN_S));
    if (countT >= 1) {
      countT -= 1;
      countN -= 1;
      if (countN <= 0) finishCountdown();
      else haptic('count');
    }
    if (st === 'countdown' && countElapsed >= secs) finishCountdown();
    return;
  }
  if (st !== 'play') return;
  tick += 1;
  if (squashT > 0) squashT = Math.max(0, squashT - dt);
  if (grounded && chick.vy >= 0) lastGroundTick = tick;

  if (charging) {
    charge = Math.min(1, charge + dt * 1000 / CFG.CHARGE_MS);
    if (charge >= 1 && !chargedFull) {
      chargedFull = true;
      haptic('full');
    }
  }

  // 蓄力時仍向前跑；地面以摩擦 a=μg 把水平速度推向跑步速度；
  // 空中才明顯受到風與二次方空氣阻力。跑到台邊且正在蓄力則自動起跳。
  if (chick.vx == null) chick.vx = CFG.RUN_SPEED;
  const prevY = chick.y;
  const envNow = envAt(chick.x);
  if (grounded && chick.vy >= 0) {
    const gGround = CFG.GRAVITY * envNow.gMul;
    const aFric = Math.max(0, envNow.mu) * gGround; // a = μ g
    const tgt = CFG.RUN_SPEED;
    const dv = tgt - chick.vx;
    const cap = aFric * dt;
    if (Math.abs(dv) <= cap) chick.vx = tgt;
    else chick.vx += (dv > 0 ? 1 : -1) * cap;
  } else {
    applyAirTo(chick, dt);
  }
  let newX = chick.x + chick.vx * dt;
  if (grounded && onPlatId) {
    const cur = plats.find(p => p.id === onPlatId);
    if (cur && newX + 8 > cur.x + cur.w) {
      if (charging) {
        chick.x = cur.x + cur.w - 8;
        releaseJump();
        newX = chick.x;
      }
    }
  }
  chick.x = newX;

  if (!grounded) {
    const newY = chick.y + chick.vy * dt;
    if (lastJump.airborne) {
      lastJump.peak = Math.max(lastJump.peak, lastJump.startY - Math.min(newY, chick.y));
    }
    let landed = null;
    if (chick.vy >= 0) {
      const feet0 = prevY + CFG.CHICKEN_R;
      const feet1 = newY + CFG.CHICKEN_R;
      for (let i = 0; i < plats.length; i++) {
        const p = plats[i];
        if (chick.x + 8 >= p.x && chick.x - 8 <= p.x + p.w && feet0 <= p.y + 4 && feet1 >= p.y) {
          landed = p;
          break;
        }
      }
    }
    if (landed) landOn(landed);
    else chick.y = newY;
  } else {
    const p = findPlatUnder(chick.x, chick.y + CFG.CHICKEN_R, 8);
    if (!p) {
      grounded = false;
      onPlatId = 0;
      chick.vy = 0;
    } else {
      chick.y = p.y - CFG.CHICKEN_R;
      onPlatId = p.id;
    }
  }

  if (chick.y - CFG.CHICKEN_R > CFG.DEATH_Y || chick.y > CFG.DEATH_Y) die();

  const lookTarget = CFG.CAM_LOOK;
  const followT = 1 - Math.exp(-CFG.CAM_FOLLOW * dt);
  camLook += (lookTarget - camLook) * followT;
  updateCam();
  ensurePlats();
}

function roundRect(x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

function drawCloud(x, y, s) {
  ctx.fillStyle = 'rgba(255,255,255,.88)';
  ctx.beginPath();
  ctx.arc(x, y, 16 * s, 0, Math.PI * 2);
  ctx.arc(x + 18 * s, y - 8 * s, 14 * s, 0, Math.PI * 2);
  ctx.arc(x + 34 * s, y, 18 * s, 0, Math.PI * 2);
  ctx.arc(x + 16 * s, y + 6 * s, 14 * s, 0, Math.PI * 2);
  ctx.fill();
}

function drawTrail() {
  for (let i = 0; i < trail.length; i++) {
    const p = trail[i];
    ctx.save();
    ctx.globalAlpha = p.a;
    ctx.translate(p.x, p.y);
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.ellipse(0, 0, CFG.CHICKEN_R * 0.85, CFG.CHICKEN_R * 1.05, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}
function drawDust() {
  for (let i = 0; i < dust.length; i++) {
    const d = dust[i];
    const u = 1 - d.t / d.life;
    ctx.globalAlpha = 0.55 * u;
    ctx.fillStyle = '#e8d7a4';
    ctx.beginPath();
    ctx.arc(d.x, d.y, 2.4 + 2.2 * u, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}
function drawChicken() {
  const r = CFG.CHICKEN_R;
  const landSq = squashT > 0 ? 0.22 * (squashT / CFG.LAND_SQUASH) : 0;
  const chargeSq = charging ? 0.28 * charge : 0;
  const stretch = stretchT > 0 ? CFG.JUMP_STRETCH * (stretchT / CFG.JUMP_STRETCH_S) : 0;
  const squat = stretch > 0 ? 0 : Math.max(chargeSq, landSq);
  ctx.save();
  ctx.translate(chick.x, chick.y + r * squat * 1.15);
  const tilt = grounded ? 0 : Math.max(-0.45, Math.min(0.7, chick.vy / 900));
  ctx.rotate(tilt);
  ctx.scale(1 + squat * 0.12 - stretch * 0.18, 1 - squat + stretch);
  // 身體
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  // 冠
  ctx.fillStyle = '#e33';
  ctx.beginPath();
  ctx.arc(-2, -r + 1, 5.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(5, -r + 4, 3.6, 0, Math.PI * 2);
  ctx.fill();
  // 喙
  ctx.fillStyle = '#f90';
  ctx.beginPath();
  ctx.moveTo(r - 3, -2);
  ctx.lineTo(r + 11, 2);
  ctx.lineTo(r - 3, 6);
  ctx.closePath();
  ctx.fill();
  // 眼
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(6, -4, 2.1, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(6.7, -4.6, 0.7, 0, Math.PI * 2);
  ctx.fill();
  // 翅膀
  ctx.fillStyle = '#f3f3f3';
  ctx.strokeStyle = '#c8c8c8';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.ellipse(-6, 4, 8, 6, -0.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.restore();
  // 腳（不受蹲下壓縮，才看起來是蹲）
  if (grounded) {
    ctx.strokeStyle = '#e09a2a';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    const footY = chick.y + r - 1;
    const bend = charging ? 4 * charge : 0;
    ctx.beginPath();
    ctx.moveTo(chick.x - 6, chick.y + 8);
    ctx.lineTo(chick.x - 8, footY - bend);
    ctx.lineTo(chick.x - 2, footY);
    ctx.moveTo(chick.x + 5, chick.y + 8);
    ctx.lineTo(chick.x + 4, footY - bend);
    ctx.lineTo(chick.x + 10, footY);
    ctx.stroke();
  }
}

function drawChargeBar() {
  if (st !== 'play') return;
  if (!(charging || grounded)) return;
  if (!charging && charge <= 0) return;
  const bw = 64, bh = 8;
  const sx = chick.x - bw / 2;
  const sy = chick.y - CFG.CHICKEN_R - 22;
  ctx.save();
  roundRect(sx - 1, sy - 1, bw + 2, bh + 2, 5);
  ctx.fillStyle = 'rgba(20,30,40,.45)';
  ctx.fill();
  roundRect(sx, sy, bw, bh, 4);
  ctx.fillStyle = '#fff';
  ctx.fill();
  const t = charge;
  if (t > 0) {
    ctx.save();
    ctx.beginPath();
    roundRect(sx, sy, bw, bh, 4);
    ctx.clip();
    ctx.fillStyle = t >= 1 ? '#ff4d3a' : (t > 0.66 ? '#ff8a1f' : '#ffd24a');
    ctx.fillRect(sx, sy, bw * t, bh);
    ctx.restore();
  }
  if (t >= 1) {
    ctx.fillStyle = '#ff4d3a';
    ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('滿', chick.x, sy - 4);
  }
  ctx.restore();
}

function wrapLines(text, maxW) {
  const chars = String(text || '');
  const lines = [];
  let line = '';
  for (let i = 0; i < chars.length; i++) {
    const t = line + chars[i];
    if (line && ctx.measureText(t).width > maxW) {
      lines.push(line);
      line = chars[i];
    } else line = t;
  }
  if (line) lines.push(line);
  return lines.length ? lines : [''];
}
function drawHills(period, yFoot, color, ridges, parallax, cx, width) {
  const shift = -((cx * parallax) % period + period) % period;
  ctx.fillStyle = color;
  ctx.beginPath();
  const start = shift - period;
  ctx.moveTo(start, yFoot);
  const copies = Math.ceil((width - start) / period) + 2;
  for (let k = 0; k < copies; k++) {
    const ox = shift + (k - 1) * period;
    for (let i = 0; i < ridges.length; i++) ctx.lineTo(ox + ridges[i][0], ridges[i][1]);
  }
  ctx.lineTo(start + copies * period, yFoot);
  ctx.lineTo(start, yFoot);
  ctx.closePath();
  ctx.fill();
}

function draw() {

  drawSunOrMoon(W, H);

    roundRect(p.x, p.y, p.w, 12, 6);

    } else if (palP === 'rain' || palP === 'storm') {

    }

  if (st === 'over') {

    ctx.fill();

    ctx.fillText('白雞不是雞，也不會飛', W / 2, cardY + 50);

    ctx.fillStyle = '#6a7a85';
    for (let i = 0; i < hintLines.length; i++) {

      'g×' + envHud.gMul.toFixed(3) + ' ρ ' + envHud.rho.toFixed(3) + ' μ ' + envHud.mu.toFixed(2),
      'fx ' + fxQuality + ' ' + fxFps.toFixed(0) + 'fps tod ' + todPhase().id

    for (let i = 0; i < lines.length; i++) ctx.fillText(lines[i], 10 + pad.l, dbgY + i * 13);
  }
  ctx.restore();
}

function loop(ts) {
  const frameDt = Math.min(0.05, ((ts - lastTs) / 1000) || 0);
  lastTs = ts;
  if (frameDt > 0 && frameDt < 0.1) noteFrame(frameDt);
  acc += frameDt;
  let n = 0;
  while (acc >= CFG.TICK && n < 5) {
    step(CFG.TICK);
    acc -= CFG.TICK;
    n++;
  }
  if (n >= 5) acc = 0;
  updateShake(frameDt);
  updateFx(frameDt);
  updateWx(frameDt);
  draw();
  requestAnimationFrame(loop);
}

// ---- 輸入：觸控與滑鼠，並關掉長按選單／選取／雙指放大 ----
let pointerId = null;
let keyHeld = false;
function onPointerDown(ev) {
  if (ev.target && ev.target.closest && ev.target.closest('#vibBtn')) return;
  ev.preventDefault();
  if (pointerId !== null) return;
  pointerId = ev.pointerId;
  startPress();
}
function onPointerUp(ev) {
  if (pointerId === null || ev.pointerId !== pointerId) return;
  pointerId = null;
  ev.preventDefault();
  endPress();
}
window.addEventListener('pointerdown', onPointerDown, { passive: false });
window.addEventListener('pointerup', onPointerUp, { passive: false });
window.addEventListener('pointercancel', onPointerUp, { passive: false });
window.addEventListener('keydown', ev => {
  if (ev.code !== 'Space' && ev.code !== 'ArrowUp') return;
  ev.preventDefault();
  if (ev.repeat || keyHeld) return;
  keyHeld = true;
  startPress();
});
window.addEventListener('keyup', ev => {
  if (ev.code !== 'Space' && ev.code !== 'ArrowUp') return;
  ev.preventDefault();
  if (!keyHeld) return;
  keyHeld = false;
  endPress();
});
window.addEventListener('contextmenu', ev => ev.preventDefault());
window.addEventListener('gesturestart', ev => ev.preventDefault());
window.addEventListener('touchstart', ev => {
  if (ev.touches && ev.touches.length > 1) ev.preventDefault();
}, { passive: false });
document.addEventListener('selectstart', ev => ev.preventDefault());

vibBtn.addEventListener('click', ev => {
  ev.preventDefault();
  ev.stopPropagation();
  setVibrate(!vibrateOn);
});
vibBtn.addEventListener('pointerdown', ev => ev.stopPropagation());

// 供 headless 驗證使用
window.__BAIJI__ = {
  CFG,
  SEED0,
  get() {
    return {
      st, score, best, seed: SEED0,
      x: chick.x, y: chick.y, vy: chick.vy, vx: chick.vx,
      grounded, charging, charge,
      vibrateOn, vibrateSupported: VIBRATE_HARDWARE,
      lastJump: Object.assign({}, lastJump),
      platCount: plats.length,
      onPlatId, lastScoredId,
      taipeiLabel: taipeiDateLabel(SEED0),
      tick, coyoteLeft: Math.max(0, COYOTE_TICKS - (tick - lastGroundTick)),
      trauma,
      countN, countT, countElapsed, lastCountdownS,
      ignoreHoldUntilRelease,
      hapticLog: (hapticLog || []).map(e => Object.assign({}, e)),
      viewW, viewH, camW, viewPadX, camX, camLook,
      weather: weather ? {
        id: weather.id, title: weather.title, emoji: weather.emoji,
        gMul: weather.gMul, rho: weather.rho, mu: weather.mu,
        precip: weather.precip, windBaseMs: weather.windBaseMs,
        gustAmpMs: weather.gustAmpMs, palette: weather.palette,
        segments: (weather.segments || []).map(s => ({ fromX: s.fromX, windMs: s.windMs })),
        lines: weatherLines(weather, envAt(chick.x))
      } : null,
      env: envAt(chick.x),
      fx: {
        quality: fxQuality, auto: fxAuto, downgraded: fxDowngraded,
        fps: fxFps, frameMs: fxFrameMs, tod: todPhase(),
        dprCap: fxMaxDpr(), particles: wxParts.length, droplets: glassDrops.length
      }
    };
  },
  flashLightning() { lightningT = 1; },
  setFx(q) {
    if (q === 'high' || q === 'medium' || q === 'low') {
      fxQuality = q; fxAuto = false; skyCache.key = '';
      if (typeof layout === 'function') layout();
    }
    return fxQuality;
  },
  weatherIds: WEATHER_IDS,
  setWeather(id) {
    initWeather(SEED0, id);
    reset();
    return weather.id;
  },
  jumpSpeed,
  simJumpTo,
  canLandOn,
  generatePlats(n) {
    const keep = CFG.LOOKAHEAD;
    CFG.LOOKAHEAD = Math.max(keep, n);
    ensurePlats();
    CFG.LOOKAHEAD = keep;
    return plats.length;
  },
  checkCourse(n) {
    return window.__BAIJI__.checkWith(SEED0, weather.id, n || 40);
  },
  checkWith(seed, weatherId, n) {
    const saved = { rng: rngState, weather: weather, plats: plats, next: nextPlatId, camX: camX, wxParts: wxParts, wxStars: wxStars };
    initWeather(seed, weatherId);
    rngState = seed;
    plats = [];
    nextPlatId = 1;
    plats.push({ id: nextPlatId++, x: 0, y: CFG.START_Y, w: CFG.START_W, kind: 'start' });
    const keep = CFG.LOOKAHEAD;
    const keepCam = camX;
    camX = -1e9;
    CFG.LOOKAHEAD = Math.max(keep, n || 40);
    ensurePlats();
    CFG.LOOKAHEAD = keep;
    camX = keepCam;
    const list = plats.slice().sort((a, b) => a.id - b.id);
    const gaps = [];
    let ok = true;
    for (let i = 0; i < list.length - 1; i++) {
      const r = canLandOn(list[i], list[i + 1]);
      const gap = list[i + 1].x - (list[i].x + list[i].w);
      gaps.push({
        from: list[i].id, to: list[i + 1].id, kind: list[i + 1].kind || '',
        gap: gap, dy: list[i].y - list[i + 1].y,
        ok: !!r.ok, charge: r.ok ? r.charge : null
      });
      if (!r.ok) ok = false;
    }
    const result = { ok, weather: weather.id, seed: seed, gaps, platCount: list.length };
    rngState = saved.rng;
    weather = saved.weather;
    plats = saved.plats;
    nextPlatId = saved.next;
    camX = saved.camX;
    wxParts = saved.wxParts;
    wxStars = saved.wxStars;
    return result;
  },
  start() {
    if (st === 'ready') startCountdown();
    return st;
  },
  skipCountdown() {
    if (st === 'ready' || st === 'countdown') finishCountdown();
    return st;
  },
  press: startPress,
  release: endPress,
  jumpWithCharge(t) {
    if (st !== 'play' || !grounded) return false;
    charging = true;
    charge = Math.max(0, Math.min(1, t));
    chargedFull = charge >= 1;
    releaseJump();
    return true;
  },
  plats() { return plats.map(p => ({ id: p.id, x: p.x, y: p.y, w: p.w, kind: p.kind || 'start' })); },
  reset,
  die,
  setVibrate
};

function onViewportChange() {
  layout();
}
window.addEventListener('resize', onViewportChange);
window.addEventListener('orientationchange', onViewportChange);
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', onViewportChange);
  window.visualViewport.addEventListener('scroll', onViewportChange);
}

syncVibUi();
layout();
initWeather(SEED0);
reset();
requestAnimationFrame(loop);
</script>
