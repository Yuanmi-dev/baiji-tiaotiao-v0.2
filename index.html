<title>白雞跳跳 v0.2</title>
<style>

    font-family:"PingFang TC","Noto Sans CJK TC","Noto Sans CJK","Noto Sans TC","Noto Sans","Microsoft JhengHei",sans-serif;
    touch-action:none;user-select:none;-webkit-user-select:none;

  #placeBar .placeNote{font-size:12px;color:#1d2a33;text-shadow:0 1px 0 rgba(255,255,255,.5);}

  #adContinueBtn{

  #adContinueBtn.visible{display:block;}
  #adFake{
    display:none;position:fixed;inset:0;z-index:30;

  }
  #adFake.visible{display:flex;}
  #adFake .adFakeTitle{font-size:22px;font-weight:700;}

<script>
/* ============================================================
   白雞跳跳 v0.2  — 難度與手感參數（調這裡即可）
   ------------------------------------------------------------
   關卡為什麼從「穿管子」改成「平台跳躍」：
   v0.1 是持續下落、連點拍翅穿過管子。蓄力必須在落地後按住再放開，
   空中長按只會一直掉下去，長短蓄力也對不到「要過哪一個缺口」。
   改成自動向前的平台關後，短按過近台、長按過遠台或高跳，蓄力才有意義。
   ============================================================ */
const CFG = {
  W: 390,
  H: 844,
  // 物理（單位：像素、秒）。模擬用固定 60 tick，避免幀率影響跳高。
  TICK: 1 / 60,
  GRAVITY: 2200,        // 上升重力
  FALL_GRAVITY_MUL: 1.8, // 下落重力倍數（較不漂）
  MAX_FALL: 1400,       // 下落速度上限
  JUMP_VY_MIN: 640,     // 輕點的最小起跳速度（向上）
  JUMP_VY_MAX: 1200,    // 蓄滿的最大起跳速度
  CHARGE_MS: 750,       // 蓄滿所需時間
  RUN_SPEED: 230,       // 水平速度；蓄力時仍會向前跑
  CHICKEN_R: 18,
  COYOTE_S: 0.10,       // 走下平台後仍可起跳的寬限
  JUMP_BUFFER_S: 0.12,  // 落地前短按，落地後仍起跳
  SHAKE_DECAY: 1.2,
  CAM_LOOK: 48,         // 鏡頭向跑向預視
  CAM_FOLLOW: 8,        // 鏡頭追及速率（指數平滑）
  LAND_SQUASH: 0.18,
  COUNTDOWN_S: 3,      // 開始與重開前的倒數秒數（會顯示 3、2、1）
  // 放開起跳的即時回饋（不改最小／最大起跳速度，以保留短長跳高度差）
  JUMP_LAUNCH_DT: 1 / 60, // 放開當下立刻跑完的物理步長（與 TICK 相同，不額外加跳高）
  JUMP_STRETCH: 0.34,     // 彈起伸展幅度
  JUMP_STRETCH_S: 0.14,   // 伸展持續秒數
  JUMP_DUST: 8,           // 起跳粉塵顆數
  JUMP_TRAIL: 5,          // 上升時的拖影段數
  // 平台
  PLAT_THICK: 24,
  PLAT_Y_MIN: 360,
  PLAT_Y_MAX: 640,
  START_W: 250,
  START_Y: 580,
  DEATH_Y: 920,
  LOOKAHEAD: 8,
  // 間距：與同高飛距對齊（下落重力 1.8 倍後，短跳約 104px，滿蓄約 195px）
  GAP_SHORT: [70, 92],
  GAP_MID:   [108, 138],
  GAP_LONG:  [152, 182],
  WIDTH_SAFE:   [130, 190],
  WIDTH_NARROW: [74, 98],
  STEP_UP:   [36, 70],
  STEP_DOWN: [40, 90],
  // 畫面：以高度 844 為基準，寬度隨可視區域延伸。CAM_X 是設計寬 390 時雞距左緣的位置。
  CAM_X: 110,
  VIEW_AHEAD: 280,   // 雞前方固定可視距離（與設計寬 390-110 相同，畫面變寬不加看前方）
  MAX_ASPECT: 2,     // 世界鏡頭最大寬高比；更寬的螢幕只向左延伸天空／山／地面，不加看前方
  // ---- 天氣與環境物理（世界尺度由地球 g 對齊：2200 px/s² = 9.81 m/s²）----
  G_EARTH: 9.81,      // m/s²，地球標準重力
  G_MOON: 1.62,       // m/s²，月球表面重力
  G_MARS: 3.71,       // m/s²，火星表面重力
  RHO0: 1.225,        // kg/m³，海平面 15°C 的 ISA 空氣密度
  RHO_HOT: 1.127,     // kg/m³，40°C 同壓下 ρ∝1/T，288.15/313.15×1.225
  RHO_MARS: 0.020,    // kg/m³，火星近地表平均密度
  // 拖曳：F_d = ½ ρ C_d A |v_rel| v_rel，方向與相對空速相反（拖曳力方程式）
  DRAG_CD: 0.47,      // 近似球形／蓬鬆身體的阻力係數
  DRAG_AREA: 0.05,    // m²，迎風面積
  DRAG_MASS: 1.5,     // kg，一隻雞的量級
  MU_DRY: 0.70,       // 乾草地／土的動摩擦係數
  MU_WET: 0.35,       // 濕滑
  MU_ICE: 0.10,       // 結冰；地面減速 a = μ g
  MU_REGOLITH: 0.40,  // 月表風化層
  RAIN_VTERM: 9,      // m/s，雨滴終端速度量級
  SNOW_VTERM: 1,      // m/s，雪花終端速度量級
  WX_PARTICLES: 90,   // 雨／雪／風線基準顆數（實際數量隨 FX 品質縮放）
  GAP_REACH: 0.86,    // 用最大飛距的這一比例當長缺口上限，保證可過
  GAP_SHORT_REACH: 0.82, // 短缺口相對於最小跳飛距
  ICE_WIDTH_MUL: 1.25,
  // ---- 前段暖身難度曲線（不改重力／起跳速度）----
  RAMP_PLATFORMS: 6,          // 前 N 個平台（含起始台）為暖身
  REACTION_S: 0.28,           // 人類落地後再開始蓄力的反應時間（秒）
  MIN_PLATFORM_LEN_FOR_CHARGE: 280, // 暖身台長度下限（像素）；實際還會依跑速／風／摩擦加長
  LAND_INSET_PAD: 48,         // 預留落地落點到台端的內縮
  TAKEOFF_PAD: 8,             // 台緣起跳餘裕（與模擬一致）
  HUMAN_CHARGE_ERR_S: 0.08,   // 人類蓄力時間誤差 ± 秒（檢查用）
  // ---- 廣告（Ad Placement API / AdSense H5；尚無正式帳號時不要填 publisher id）----
  ADS_ENABLED: false,         // 正式投放前保持關閉；可用 ?ads=1 或 ?fakead=1 測試
  ADS_TEST_MODE: true,        // 有正式 AdSense 並通過審核後改 false，並拿掉 data-adbreak-test
  ADS_CLIENT: '',             // 日後填入 'ca-pub-xxxxxxxxxxxxxxxx'，不要預填真實或假的 id
  ADS_INTERSTITIAL_EVERY: 3,  // 每完成 N 局、下一次倒數前插一次 interstitial（type: next）
  ADS_FAKE_MS: 1400,          // ?fakead=1 模擬廣告的最短顯示毫秒
  // ---- 天氣視覺（質感對齊 iPhone 天氣 App／動態桌布；不影響物理與公平性）----
  FX_QUALITY: 'auto',     // auto | high | medium | low；也可 ?fx=low
  FX_MAX_DPR_HIGH: 2.5,
  FX_MAX_DPR_LOW: 1.5,
  FX_TOD: true,           // 依台北時間做晨昏夜色調，只改視覺
  FX_HAZE: true,          // 高溫熱浪：只扭天空，不扭雞與平台
  FX_LIGHTNING: true,     // 暴風雨偶發閃電（無雷聲）
  WX_RAIN_BG: 48,
  WX_RAIN_FG: 36,
  WX_SNOW: 64,
  WX_DUST: 36,
  WX_DROPLETS: 11,        // 鏡頭玻璃水珠
  WX_CLOUD_FAR: 5,
  WX_CLOUD_MID: 5,
  WX_CLOUD_NEAR: 4
};

// ---- 每日種子：台北時間（Asia/Taipei）的年月日 ----
function taipeiSeed() {
  const iso = new Intl.DateTimeFormat('en-CA', {
    timeZone: 'Asia/Taipei',
    year: 'numeric', month: '2-digit', day: '2-digit'
  }).format(new Date());
  return Number(iso.replace(/-/g, ''));
}
function taipeiDateLabel(seed) {
  const s = String(seed);
  return s.slice(0, 4) + '-' + s.slice(4, 6) + '-' + s.slice(6, 8);
}

// 畫面日期依裝置時區；每日種子仍只用台北日期，全玩家同一關
function deviceTimeZone() {
  try {
    return Intl.DateTimeFormat().resolvedOptions().timeZone || 'Asia/Taipei';
  } catch (e) {
    return 'Asia/Taipei';
  }
}
const DEVICE_TZ = deviceTimeZone();
const TZ_PLACE_ZH = {
  'Asia/Taipei': '台北', 'Asia/Shanghai': '上海', 'Asia/Hong_Kong': '香港',
  'Asia/Macau': '澳門', 'Asia/Tokyo': '東京', 'Asia/Seoul': '首爾',
  'Asia/Singapore': '新加坡', 'Asia/Bangkok': '曼谷', 'Asia/Jakarta': '雅加達',
  'Asia/Kuala_Lumpur': '吉隆坡', 'Asia/Manila': '馬尼拉', 'Asia/Ho_Chi_Minh': '胡志明市',
  'Asia/Makassar': '望加錫', 'Asia/Chongqing': '重慶', 'Asia/Harbin': '哈爾濱',
  'Australia/Sydney': '雪梨', 'Australia/Melbourne': '墨爾本',
  'Pacific/Auckland': '奧克蘭', 'Pacific/Honolulu': '檀香山',
  'America/Los_Angeles': '洛杉磯', 'America/Vancouver': '溫哥華',
  'America/New_York': '紐約', 'America/Chicago': '芝加哥',
  'America/Toronto': '多倫多', 'America/Sao_Paulo': '聖保羅',
  'Europe/London': '倫敦', 'Europe/Paris': '巴黎', 'Europe/Berlin': '柏林',
  'Europe/Amsterdam': '阿姆斯特丹', 'Europe/Rome': '羅馬',
  'Europe/Madrid': '馬德里', 'Europe/Zurich': '蘇黎世',
  'UTC': 'UTC', 'Etc/UTC': 'UTC', 'Etc/GMT': 'GMT'
};
function tzPlaceName(tz) {
  if (TZ_PLACE_ZH[tz]) return TZ_PLACE_ZH[tz];
  const part = String(tz || '').split('/').pop() || '';
  return part.replace(/_/g, ' ') || tz || '本機';
}
function deviceDateLabel() {
  try {
    return new Intl.DateTimeFormat('en-CA', {
      timeZone: DEVICE_TZ, year: 'numeric', month: '2-digit', day: '2-digit'
    }).format(new Date());
  } catch (e) {
    return taipeiDateLabel(taipeiSeed());
  }
}

let locState = {
  status: 'idle', // idle | asking | ok | denied | error | unsupported
  label: tzPlaceName(DEVICE_TZ),
  fromGeo: false,
  msg: ''
};
function placeLine() {
  return locState.label + '　' + deviceDateLabel();
}

const SEED0 = taipeiSeed();
const BEST_KEY = 'baijiBest.v02.' + SEED0;
const VIB_KEY = 'baijiVibrate.v02';
const MUTE_KEY = 'baijiMute.v02';
const URL_PARAMS = new URLSearchParams((location.search || '').replace(/^\?/, ''));
const DEBUG = URL_PARAMS.get('debug') === '1';
const PROMO = URL_PARAMS.get('promo') === '1';
if (PROMO) document.documentElement.classList.add('promo');
const UI_FONT = '"PingFang TC","Noto Sans CJK TC","Noto Sans CJK","Noto Sans TC","Noto Sans","Microsoft JhengHei",sans-serif';
const WEATHER_FORCE = (URL_PARAMS.get('weather') || '').toLowerCase().trim();
const FX_FORCE = (URL_PARAMS.get('fx') || '').toLowerCase().trim();
const TOD_FORCE = (URL_PARAMS.get('tod') || '').toLowerCase().trim();
const ADS_FORCE = (URL_PARAMS.get('ads') || '').toLowerCase().trim();
const FAKE_AD = URL_PARAMS.get('fakead') === '1';

/* ============================================================
   天氣與環境物理
   尺度：CFG.GRAVITY（2200 px/s²）對齊地球 g=9.81 m/s²，
   因此 1 m = GRAVITY/G_EARTH ≈ 224.3 px。此尺度不隨天體改變；
   月球／火星日只改 g 的比例。每日種子與天氣仍依台北（Asia/Taipei）日期，
   同一天所有人條件相同；畫面上的日期與地區則依裝置時區，定位需玩家自行點選。
   ?weather=id 可強制指定（例如 moon）。
   ============================================================ */
function pxPerM() { return CFG.GRAVITY / CFG.G_EARTH; }
function seedHash(n) {
  let x = (n >>> 0) ^ 0xA5A5A5A5;
  x = Math.imul(x ^ (x >>> 16), 0x7feb352d);
  x = Math.imul(x ^ (x >>> 15), 0x846ca68b);
  return (x ^ (x >>> 16)) >>> 0;
}
function mulberry32(a) {
  return function () {
    a |= 0;
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// 天氣清單：id 供 ?weather= 使用
const WEATHER_IDS = ['clear','tailwind','headwind','gusty','rain','storm','ice','snow','hot','moon','mars'];

function buildWeather(id, seed) {
  const rndw = mulberry32(seedHash(seed ^ 0x9E3779B9 ^ seedHash(id.length * 13 + id.charCodeAt(0))));
  const range = (a, b) => a + rndw() * (b - a);
  const gE = CFG.G_EARTH;
  const rho0 = CFG.RHO0;
  const base = {
    id: id,
    gMul: 1,
    rho: rho0,
    mu: CFG.MU_DRY,
    precip: '',
    windBaseMs: 0,
    gustAmpMs: 0,
    gustLambda: 900,
    gustPhase: 0,
    segments: [],
    palette: 'earth'
  };
  if (id === 'clear') {
    base.title = '晴朗';
    base.emoji = '☀️';
  } else if (id === 'tailwind') {
    base.title = '順風';
    base.emoji = '🌬️';
    base.windBaseMs = range(3, 7);
    base.palette = 'wind';
  } else if (id === 'headwind') {
    base.title = '逆風';
    base.emoji = '🌬️';
    base.windBaseMs = -range(3, 7);
    base.palette = 'wind';
  } else if (id === 'gusty') {
    base.title = '陣風';
    base.emoji = '💨';
    base.windBaseMs = range(-2, 2);
    base.gustAmpMs = range(3, 6);
    base.gustLambda = range(700, 1400);
    base.gustPhase = range(0, Math.PI * 2);
    // 種子決定的鋒面：關卡中改變平均風向
    let x = 0;
    base.segments = [];
    for (let i = 0; i < 3; i++) {
      x += (i === 0 ? 0 : range(700, 1300));
      const dir = rndw() < 0.5 ? -1 : 1;
      base.segments.push({ fromX: x, windMs: dir * range(2, 6) });
    }
    base.palette = 'wind';
  } else if (id === 'rain') {
    base.title = '降雨';
    base.emoji = '🌧️';
    base.mu = CFG.MU_WET;
    base.precip = 'rain';
    base.windBaseMs = range(-2, 3);
    base.palette = 'rain';
  } else if (id === 'storm') {
    base.title = '暴風雨';
    base.emoji = '⛈️';
    base.mu = CFG.MU_WET;
    base.precip = 'rain';
    base.windBaseMs = -range(7, 11);
    base.gustAmpMs = range(2, 4);
    base.gustLambda = range(500, 900);
    base.gustPhase = range(0, Math.PI * 2);
    let x = 0;
    base.segments = [];
    for (let i = 0; i < 3; i++) {
      x += (i === 0 ? 0 : range(600, 1100));
      base.segments.push({ fromX: x, windMs: -range(6, 12) });
    }
    base.palette = 'storm';
  } else if (id === 'ice') {
    base.title = '路面結冰';
    base.emoji = '🧊';
    base.mu = CFG.MU_ICE;
    base.precip = 'snow';
    base.windBaseMs = range(-1.5, 2);
    base.palette = 'ice';
  } else if (id === 'snow') {
    base.title = '降雪';
    base.emoji = '❄️';
    base.mu = (CFG.MU_WET + CFG.MU_ICE) * 0.5; // 約 0.225，積雪濕滑
    base.precip = 'snow';
    base.windBaseMs = range(-2, 4);
    base.palette = 'snow';
  } else if (id === 'hot') {
    base.title = '高溫';
    base.emoji = '🔥';
    base.rho = CFG.RHO_HOT;
    base.windBaseMs = range(0, 2);
    base.palette = 'hot';
  } else if (id === 'moon') {
    // 月球幾乎真空，無氣動拖曳；g_moon/g_earth = 1.62/9.81
    base.title = '月球日';
    base.emoji = '🌙';
    base.gMul = CFG.G_MOON / gE;
    base.rho = 0;
    base.mu = CFG.MU_REGOLITH;
    base.windBaseMs = 0;
    base.palette = 'moon';
  } else if (id === 'mars') {
    base.title = '火星日';
    base.emoji = '🔴';
    base.gMul = CFG.G_MARS / gE;
    base.rho = CFG.RHO_MARS;
    base.mu = 0.55;
    base.windBaseMs = range(8, 16); // 火星風速可高，但空氣極稀薄，氣動力很小
    base.gustAmpMs = range(2, 5);
    base.gustLambda = range(800, 1500);
    base.gustPhase = range(0, Math.PI * 2);
    base.palette = 'mars';
  } else {
    base.title = '晴朗';
    base.emoji = '☀️';
    base.id = 'clear';
  }
  return base;
}

function chooseWeatherId(seed) {
  if (WEATHER_FORCE && WEATHER_IDS.indexOf(WEATHER_FORCE) >= 0) return WEATHER_FORCE;
  return WEATHER_IDS[seedHash(seed) % WEATHER_IDS.length];
}

function windWords(ms) {
  const a = Math.abs(ms);
  if (a < 0.4) return '';
  const n = a >= 10 ? a.toFixed(0) : a.toFixed(1);
  return (ms > 0 ? '順風 ' : '逆風 ') + n + ' m/s';
}
function windArrow(ms) {
  if (Math.abs(ms) < 0.4) return '';
  // 正值＝順風（向右），負值＝逆風（向左）
  return ms > 0 ? '→' : '←';
}
function weatherFeel(w) {

  if (w.id === 'moon' || w.id === 'mars') return '飄更久';

  if (w.id === 'headwind') return '飛距較短';
  if (w.id === 'gusty') return '風向會變';
  if (w.id === 'hot') return '阻力較小';
  return '';
}
function weatherDetail(w, env) {
  if (!w) return '';
  if (w.id === 'moon' || w.id === 'mars') return '重力 ' + w.gMul.toFixed(2) + 'g';
  if (w.id === 'hot') return '空氣密度 ' + (w.rho / CFG.RHO0).toFixed(2) + ' ρ₀';
  if (w.id === 'ice') return '路面結冰';
  const ww = windWords(env ? env.windMs : w.windBaseMs);
  if (ww) return ww;
  if (w.id === 'clear') return '地球重力';

}
function weatherHeadline(w, env) {

}
function weatherLines(w, env) {

let wxParts = [];
let wxStars = [];

function initWeather(seed, forceId) {

function envAt(x) {
  const w = weather;
  let windMs = w.windBaseMs;
  if (w.segments && w.segments.length) {
    for (let i = 0; i < w.segments.length; i++) {
      if (x >= w.segments[i].fromX) windMs = w.segments[i].windMs;
    }
  }
  if (w.gustAmpMs) {
    windMs += w.gustAmpMs * Math.sin(x / w.gustLambda + w.gustPhase);
  }
  return {
    gMul: w.gMul,
    rho: w.rho,
    mu: w.mu,
    precip: w.precip,
    windMs: windMs,
    windPx: windMs * pxPerM(),
    palette: w.palette
  };
}

// 為保持跳高，初速依 v=√(2gh) 隨 √g 縮放（h 固定時 v ∝ √g）
function jumpSpeed(charge) {
  const t = Math.max(0, Math.min(1, charge));
  const base = CFG.JUMP_VY_MIN + t * (CFG.JUMP_VY_MAX - CFG.JUMP_VY_MIN);
  return base * Math.sqrt(weather.gMul);
}

// 空氣動力學：a_drag = −(½ C_d A / m) ρ |v_rel| v_rel
// 寫成像素：a_px = −K ρ |v_px| v_px / (px/m)，K = ½ C_d A / m
function applyAirTo(s, dt) {
  const env = envAt(s.x);
  const g = CFG.GRAVITY * env.gMul;
  const gUse = s.vy > 0 ? g * CFG.FALL_GRAVITY_MUL : g;
  const relX = s.vx - env.windPx;
  const relY = s.vy; // 風視為水平
  const rel = Math.hypot(relX, relY);
  const K = 0.5 * CFG.DRAG_CD * CFG.DRAG_AREA / CFG.DRAG_MASS;
  const ppm = pxPerM();
  if (rel > 1e-6 && env.rho > 1e-8) {
    const mul = (K * env.rho * rel) / ppm;
    s.vx -= mul * relX * dt;
    s.vy -= mul * relY * dt;
  }
  s.vy += gUse * dt;
  if (env.rho > 1e-8) {
    // 終端速度 v_t = √(2 m g / (ρ C_d A))，只限制下落
    const vt = Math.sqrt((CFG.DRAG_MASS * (gUse / ppm)) / (0.5 * env.rho * CFG.DRAG_CD * CFG.DRAG_AREA + 1e-12)) * ppm;
    if (s.vy > 0) s.vy = Math.min(s.vy, vt);
  } else if (s.vy > CFG.MAX_FALL * 3) {
    s.vy = CFG.MAX_FALL * 3;
  }
}

function simJumpTo(charge, x0, y0, vx0, platY) {
  const s = { x: x0, y: y0, vx: vx0, vy: -jumpSpeed(charge) };
  let prevY = s.y;
  const dt = CFG.TICK;
  const R = CFG.CHICKEN_R;
  let peak = 0;
  for (let i = 0; i < 720; i++) {
    applyAirTo(s, dt);
    s.x += s.vx * dt;
    const newY = s.y + s.vy * dt;
    peak = Math.max(peak, y0 - Math.min(newY, s.y));
    if (s.vy >= 0) {
      const feet0 = prevY + R;
      const feet1 = newY + R;
      if (feet0 <= platY + 4 && feet1 >= platY) {
        return { x: s.x, y: platY - R, landed: true, peak: peak, steps: i + 1, vx: s.vx };
      }
    }
    s.y = newY;
    prevY = s.y;
    if (s.y > CFG.DEATH_Y) break;
  }
  return { x: s.x, y: s.y, landed: false, peak: peak, steps: 0, vx: s.vx };
}

function jumpReach(charge, y0, platY, x0) {
  const r = simJumpTo(charge, x0, y0, CFG.RUN_SPEED, platY);
  return r.x - x0;
}

function fitGap(kind, rawGap, prev, nextY) {
  const x0 = prev.x + prev.w - 8;
  const y0 = prev.y - CFG.CHICKEN_R;
  let r0 = jumpReach(0, y0, nextY, x0);
  let r1 = jumpReach(1, y0, nextY, x0);
  if (r1 < r0) { const t = r0; r0 = r1; r1 = t; }
  // 低重力等飛距變長時，短／中／長缺口都按可達距離等比放大，避免最小跳就越過下一台
  const shortHi = Math.max(36, r0 * CFG.GAP_SHORT_REACH);
  const longHi = Math.max(shortHi + 12, r1 * CFG.GAP_REACH);
  const midLo = Math.min(r0 * 1.05, longHi * 0.72);
  const midHi = Math.max(midLo + 8, longHi * 0.78);
  const longLo = Math.min(Math.max(midHi + 6, r0 * 1.10), longHi * 0.96);
  function band(lo, hi, raw, rawLo, rawHi) {
    let u = (raw - rawLo) / Math.max(1e-6, rawHi - rawLo);
    u = Math.max(0, Math.min(1, u));
    return lo + u * Math.max(0, hi - lo);
  }
  let gap;
  if (kind === 'short') {
    gap = band(shortHi * 0.72, shortHi, rawGap, CFG.GAP_SHORT[0], CFG.GAP_SHORT[1]);
  } else if (kind === 'mid') {
    gap = band(midLo, midHi, rawGap, CFG.GAP_MID[0], CFG.GAP_MID[1]);
  } else if (kind === 'long') {
    gap = band(longLo, longHi, rawGap, CFG.GAP_LONG[0], CFG.GAP_LONG[1]);
  } else {
    gap = band(midLo, midHi, rawGap, CFG.GAP_MID[0] - 16, CFG.GAP_MID[1] - 10);
  }
  if (!(gap > 0)) gap = shortHi;
  return Math.max(28, gap);
}

function canLandOn(prev, next) {
  const y0 = prev.y - CFG.CHICKEN_R;
  const tries = [0, 0.12, 0.25, 0.4, 0.55, 0.7, 0.85, 1];
  const takeoffs = [prev.x + prev.w - 8];
  const mid = prev.x + prev.w * 0.55;
  if (mid < takeoffs[0] - 10) takeoffs.push(mid);
  takeoffs.push(prev.x + Math.min(40, prev.w * 0.3));
  for (let t = 0; t < takeoffs.length; t++) {
    const x0 = Math.max(prev.x + 8, takeoffs[t]);
    for (let i = 0; i < tries.length; i++) {
      const r = simJumpTo(tries[i], x0, y0, CFG.RUN_SPEED, next.y);
      if (r.landed && r.x + 8 >= next.x && r.x - 8 <= next.x + next.w) {
        return { ok: true, charge: tries[i], takeoffX: x0, landX: r.x };
      }
    }
    // 若最小跳已超過平台，再往前提起跳點
    const over = simJumpTo(0, x0, y0, CFG.RUN_SPEED, next.y);
    if (over.landed && over.x - 8 > next.x + next.w) continue;
    // 二分蓄力找可落點
    let lo = 0, hi = 1, ok = null;
    for (let k = 0; k < 10; k++) {
      const midc = (lo + hi) / 2;
      const r = simJumpTo(midc, x0, y0, CFG.RUN_SPEED, next.y);
      if (r.landed && r.x + 8 >= next.x && r.x - 8 <= next.x + next.w) { ok = r; ok.charge = midc; break; }
      if (!r.landed || r.x + 8 < next.x) lo = midc;
      else hi = midc;
    }
    if (ok) return { ok: true, charge: ok.charge, takeoffX: x0, landX: ok.x };
  }
  return { ok: false };
}

let fxAuto = true;
let fxDowngraded = false;

let fxFps = 60;

function detectFxQuality() {
  if (PROMO) {
    fxAuto = false;
    return 'high';
  }
  if (FX_FORCE === 'high' || FX_FORCE === 'medium' || FX_FORCE === 'low') {
    fxAuto = false;
    return FX_FORCE;
  }
  if (CFG.FX_QUALITY && CFG.FX_QUALITY !== 'auto') {
    fxAuto = false;
    return CFG.FX_QUALITY;
  }
  fxAuto = true;
  const cores = navigator.hardwareConcurrency || 4;
  const mem = navigator.deviceMemory || 4;
  const dpr = window.devicePixelRatio || 1;
  if (cores <= 4 || mem <= 2 || dpr >= 3) return 'medium';
  return 'high';
}
fxQuality = detectFxQuality();
function fxMul() {
  return fxQuality === 'low' ? 0.45 : fxQuality === 'medium' ? 0.7 : 1;
}
function fxMaxDpr() {
  return fxQuality === 'low' ? CFG.FX_MAX_DPR_LOW : CFG.FX_MAX_DPR_HIGH;
}
function fxCount(n) {
  return Math.max(4, Math.round(n * fxMul()));
}
function noteFrame(dt) {
  const ms = dt * 1000;
  frameSamples.push(ms);
  if (frameSamples.length > 90) frameSamples.shift();
  if (frameSamples.length >= 20) {
    const avg = frameSamples.reduce((a, b) => a + b, 0) / frameSamples.length;
    fxFrameMs = avg;
    fxFps = avg > 0.1 ? 1000 / avg : 60;
  }
  if (fxAuto && !fxDowngraded && frameSamples.length >= 75) {
    const avg = frameSamples.reduce((a, b) => a + b, 0) / frameSamples.length;
    if (avg > 22) {
      const order = ['high', 'medium', 'low'];
      const i = order.indexOf(fxQuality);
      if (i >= 0 && i < order.length - 1) {
        fxQuality = order[i + 1];
        fxDowngraded = true;
        skyCache.key = '';
        if (typeof layout === 'function') layout();
      }
    }
  }
}

function taipeiHourFloat() {
  if (TOD_FORCE) {
    const map = { dawn: 6, morning: 8.5, noon: 12.5, golden: 17, sunset: 18.4, dusk: 19.8, night: 22 };
    if (map[TOD_FORCE] != null) return map[TOD_FORCE];
  }
  try {
    const parts = new Intl.DateTimeFormat('en-GB', {
      timeZone: 'Asia/Taipei', hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
    }).formatToParts(new Date());
    const h = Number((parts.find(p => p.type === 'hour') || {}).value || 12);
    const m = Number((parts.find(p => p.type === 'minute') || {}).value || 0);
    return h + m / 60;
  } catch (e) {
    return 12;
  }
}
function todPhase() {
  if (!CFG.FX_TOD) return { id: 'noon', hour: 12 };
  const h = taipeiHourFloat();
  let id = 'night';
  if (h >= 5 && h < 7) id = 'dawn';
  else if (h >= 7 && h < 10) id = 'morning';
  else if (h >= 10 && h < 16) id = 'noon';
  else if (h >= 16 && h < 17.6) id = 'golden';
  else if (h >= 17.6 && h < 19.2) id = 'sunset';
  else if (h >= 19.2 && h < 20.7) id = 'dusk';
  return { id, hour: h };
}

  const pal = weather ? weather.palette : 'earth';

  const id = todPhase().id;

}

function ensureSkyCache() {

function updateWx(dt) {

  const want = [];
  for (let i = 0; i < bud.rainBg; i++) want.push('rainBg');
  for (let i = 0; i < bud.rainFg; i++) want.push('rainFg');

  while (wxParts.length > want.length) wxParts.pop();

  const wind = env.windPx;
  for (let i = 0; i < wxParts.length; i++) {
    const p = wxParts[i];
    p.wob += dt * p.wobs;
    if (p.kind === 'rainBg' || p.kind === 'rainFg') {
      const depth = p.kind === 'rainBg' ? 0.82 : 1;
      p.vy = CFG.RAIN_VTERM * ppm * depth;
      p.vx = wind * depth;
    } else if (p.kind === 'snow') {

      p.vx = wind * (0.7 + p.z * 0.3) + Math.sin(p.wob) * 18;
    } else {
      p.vy = 36 + Math.abs(wind) * 0.02;
      p.vx = wind * 0.32 + Math.sin(p.wob) * 10;

    p.x += (p.vx || 0) * dt;
    p.y += (p.vy || 0) * dt;
    if (p.y > H + 40 || p.x < -90 || p.x > W + 90) {

      x: Math.random() * W,
      y: Math.random() * H * 0.7,
      r: 2.2 + Math.random() * 3.4,
      vy: 14 + Math.random() * 28,
      trail: 0

      vy: Math.sin(ang) * spd * 0.7 - 40,
      life: 0.32 + (i % 4) * 0.04,
      t: 0,
      g: 420,
      r: 1.6 + (i % 3) * 0.4,
      color: i % 2 ? '#ffe08a' : '#fff6d0'
    });
  }
  dust.push({
    kind: 'ring',
    x: chick.x,
    y: feetY - 2,
    vx: 0, vy: 0,
    life: 0.34,
    t: 0,
    g: 0,
    r: 8
  });
}
function updateFx(dt) {
  if (stretchT > 0) stretchT = Math.max(0, stretchT - dt);
  if (st === 'play' && wxBannerT > 0) wxBannerT = Math.max(0, wxBannerT - dt);
  for (let i = 0; i < dust.length; i++) {
    const d = dust[i];
    d.t += dt;
    d.x += d.vx * dt;
    d.y += d.vy * dt;
    d.vy += (d.g != null ? d.g : 900) * dt;
  }
  dust = dust.filter(d => d.t < d.life);
  if (!grounded && chick.vy < 0) {
    trail.push({ x: chick.x, y: chick.y, a: 0.3 });
    if (trail.length > CFG.JUMP_TRAIL) trail.shift();
  } else if (trail.length) {
    for (let i = 0; i < trail.length; i++) trail[i].a *= 0.68;
    trail = trail.filter(p => p.a > 0.04);
  }
}
function releaseJump() {
  if (!charging) return;
  const t = Math.max(0, Math.min(1, charge));
  const vy = jumpSpeed(t);
  charging = false;
  charge = 0;
  chargedFull = false;
  grounded = false;
  onPlatId = 0;
  lastGroundTick = NEVER;
  lastPressTick = NEVER;
  bufferedJump = false;
  squashT = 0;
  chick.vy = -vy;
  lastJump = { vy: vy, charge: t, peak: 0, airborne: true, startY: chick.y };
  stretchT = CFG.JUMP_STRETCH_S;
  spawnJumpDust();
  haptic('jump');
  playSfx('jump', { vol: 0.55 + 0.45 * t });
  // 若不在物理步內，立刻跑完一步並重繪，讓放開當幀位置就上升
  if (!inStep) {
    acc -= CFG.JUMP_LAUNCH_DT;
    step(CFG.JUMP_LAUNCH_DT);
    draw();
  }
}

function findPlatUnder(px, feetY, slop) {
  for (let i = 0; i < plats.length; i++) {
    const p = plats[i];
    if (px + 8 >= p.x && px - 8 <= p.x + p.w && feetY >= p.y - slop && feetY <= p.y + 18) return p;
  }
  return null;
}

function landOn(p) {
  chick.y = p.y - CFG.CHICKEN_R;
  chick.vy = 0;
  grounded = true;
  lastGroundTick = tick;
  const didLand = lastJump.airborne;
  if (lastJump.airborne) {
    lastJump.peak = Math.max(lastJump.peak, lastJump.startY - chick.y);
    lastJump.airborne = false;
    squashT = CFG.LAND_SQUASH;
    spawnLandDust();
    playSfx('land');
  }
  let justScored = false;
  if (p.id !== onPlatId && p.id > lastScoredId) {
    score += 1;
    lastScoredId = p.id;
    haptic('score');
    justScored = true;
  }
  onPlatId = p.id;
  lastSafePlatId = p.id;
  lastSafePlatSnap = { id: p.id, x: p.x, y: p.y, w: p.w, kind: p.kind || '' };
  if (didLand && justScored) {
    const mid = p.x + p.w * 0.5;
    if (Math.abs(chick.x - mid) <= p.w * 0.22) {
      playSfx('perfect');
      spawnPerfectBurst();
    }
  }
  if (isHeld() && !charging) {
    charging = true;
    charge = 0;
    chargedFull = false;
    bufferedJump = false;
    playSfx('charge');
  } else if (bufferedJump && tick - lastPressTick <= BUFFER_TICKS) {
    charging = true;
    charge = Math.max(0, Math.min(1, bufferedCharge));
    bufferedJump = false;
    releaseJump();
  } else {
    charging = false;
    charge = 0;
    bufferedJump = false;
  }
}

function die() {
  if (st === 'over') return;
  charging = false;
  charge = 0;
  st = 'over';
  tOver = 0;
  if (typeof syncSceneChrome === 'function') syncSceneChrome();
  haptic('hit');
  playSfx('fail');
  if (score > best) {
    best = score;
    localStorage.setItem(BEST_KEY, String(best));
  }
  offerRewardContinue();
}

function step(dt) {
  inStep = true;
  try { stepBody(dt); } finally { inStep = false; }
}
function stepBody(dt) {
  if (adsPaused) return;
  if (st === 'over') { tOver += dt; return; }
  if (st === 'countdown') {
    countT += dt;
    countElapsed += dt;
    const secs = Math.max(0, Math.round(CFG.COUNTDOWN_S));
    if (countT >= 1) {
      countT -= 1;
      countN -= 1;
      if (countN <= 0) finishCountdown();
      else haptic('count');
    }
    if (st === 'countdown' && countElapsed >= secs) finishCountdown();
    return;
  }
  if (st !== 'play') return;
  tick += 1;
  if (squashT > 0) squashT = Math.max(0, squashT - dt);
  if (grounded && chick.vy >= 0) lastGroundTick = tick;

  if (charging) {
    charge = Math.min(1, charge + dt * 1000 / CFG.CHARGE_MS);
    if (charge >= 1 && !chargedFull) {
      chargedFull = true;
      haptic('full');
    }
  }

  // 蓄力時仍向前跑；地面以摩擦 a=μg 把水平速度推向跑步速度；
  // 空中才明顯受到風與二次方空氣阻力。跑到台邊且正在蓄力則自動起跳。
  if (chick.vx == null) chick.vx = CFG.RUN_SPEED;
  const prevY = chick.y;
  const envNow = envAt(chick.x);
  if (grounded && chick.vy >= 0) {
    const gGround = CFG.GRAVITY * envNow.gMul;
    const aFric = Math.max(0, envNow.mu) * gGround; // a = μ g
    const tgt = CFG.RUN_SPEED;
    const dv = tgt - chick.vx;
    const cap = aFric * dt;
    if (Math.abs(dv) <= cap) chick.vx = tgt;
    else chick.vx += (dv > 0 ? 1 : -1) * cap;
  } else {
    applyAirTo(chick, dt);
  }
  let newX = chick.x + chick.vx * dt;
  if (grounded && onPlatId) {
    const cur = plats.find(p => p.id === onPlatId);
    if (cur && newX + 8 > cur.x + cur.w) {
      if (charging) {
        chick.x = cur.x + cur.w - 8;
        releaseJump();
        newX = chick.x;
      }
    }
  }
  chick.x = newX;

  if (!grounded) {
    const newY = chick.y + chick.vy * dt;
    if (lastJump.airborne) {
      lastJump.peak = Math.max(lastJump.peak, lastJump.startY - Math.min(newY, chick.y));
    }
    let landed = null;
    if (chick.vy >= 0) {
      const feet0 = prevY + CFG.CHICKEN_R;
      const feet1 = newY + CFG.CHICKEN_R;
      for (let i = 0; i < plats.length; i++) {
        const p = plats[i];
        if (chick.x + 8 >= p.x && chick.x - 8 <= p.x + p.w && feet0 <= p.y + 4 && feet1 >= p.y) {
          landed = p;
          break;
        }
      }
    }
    if (landed) landOn(landed);
    else chick.y = newY;
  } else {
    const p = findPlatUnder(chick.x, chick.y + CFG.CHICKEN_R, 8);
    if (!p) {
      grounded = false;
      onPlatId = 0;
      chick.vy = 0;
    } else {
      chick.y = p.y - CFG.CHICKEN_R;
      onPlatId = p.id;
    }
  }

  if (chick.y - CFG.CHICKEN_R > CFG.DEATH_Y || chick.y > CFG.DEATH_Y) die();

  const lookTarget = CFG.CAM_LOOK + ((!grounded && st === 'play') ? 22 : 0);
  const followT = 1 - Math.exp(-CFG.CAM_FOLLOW * dt);
  camLook += (lookTarget - camLook) * followT;
  updateCam();
  ensurePlats();
}

function roundRect(x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

function drawCloud(x, y, s) {

  ctx.beginPath();
  ctx.arc(x, y, 16 * s, 0, Math.PI * 2);
  ctx.arc(x + 18 * s, y - 8 * s, 14 * s, 0, Math.PI * 2);
  ctx.arc(x + 34 * s, y, 18 * s, 0, Math.PI * 2);
  ctx.arc(x + 16 * s, y + 6 * s, 14 * s, 0, Math.PI * 2);

function drawTrail() {

function drawDust() {
  const col = dustColor();
  for (let i = 0; i < dust.length; i++) {
    const d = dust[i];
    const u = Math.max(0, 1 - d.t / d.life);
    if (d.kind === 'ring') {
      ctx.save();
      ctx.globalAlpha = 0.7 * u;
      ctx.strokeStyle = '#ffe08a';
      ctx.lineWidth = 2.2 * u + 0.6;
      ctx.beginPath();

      ctx.stroke();
      ctx.restore();

      ctx.save();
      ctx.globalAlpha = 0.95 * u;
      ctx.fillStyle = d.color || '#ffe08a';
      ctx.beginPath();
      ctx.arc(d.x, d.y, (d.r || 1.8) * (0.7 + u * 0.5), 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

    }
    ctx.globalAlpha = 0.55 * u;
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.ellipse(d.x, d.y, (d.r || 2.4) + 2.4 * u, (d.r || 2.4) * 0.7 + 1.4 * u, 0, 0, Math.PI * 2);

function drawChickenShadow() {

  } else {
    let best = 1e9;
    for (let i = 0; i < plats.length; i++) {
      const p = plats[i];
      if (chick.x + 10 >= p.x && chick.x - 10 <= p.x + p.w && p.y >= chick.y) {
        const gap = p.y - chick.y;
        if (gap < best) { best = gap; groundY = p.y; }

  }
  if (groundY == null) return;
  const gap = Math.max(0, groundY - (chick.y + r));
  const sa = grounded ? 0.26 : Math.max(0.06, 0.24 - gap / 320);
  const rx = grounded ? 15.5 : 13 + Math.min(16, gap * 0.05);

function drawChargeGlow() {
  if (st !== 'play' || !charging || charge <= 0) return;

  const a = 0.16 + 0.32 * charge;
  const rgb = charge >= 1 ? '255,168,70' : '120,198,140';
  const g = ctx.createRadialGradient(chick.x, chick.y + 2, 3, chick.x, chick.y + 2, rad);
  g.addColorStop(0, 'rgba(' + rgb + ',' + a + ')');
  g.addColorStop(0.55, 'rgba(' + rgb + ',' + (a * 0.35) + ')');

function paintBird(wingLift = 0) {
  function oval(x,y,rx,ry,angle,color,outline) {

    ctx.ellipse(x,y,rx,ry,angle,0,Math.PI*2);
    ctx.fillStyle=color;

function drawChicken() {
  const r = CFG.CHICKEN_R;
  const landSq = squashT > 0 ? 0.34 * (squashT / CFG.LAND_SQUASH) : 0;
  const chargeSq = charging ? 0.32 * charge : 0;
  const stretch = stretchT > 0 ? (CFG.JUMP_STRETCH + 0.08) * (stretchT / CFG.JUMP_STRETCH_S) : 0;
  const squat = stretch > 0 ? 0 : Math.max(chargeSq, landSq);
  const running = grounded && st === 'play';
  // Anchor the stride to distance so the cadence follows the actual run speed.
  const phase = (chick.x % 68) * Math.PI * 2 / 68;
  const stride = running ? 1 - chargeSq * 1.8 : 0;
  const bob = stride * 2 * Math.sin(phase) ** 2;
  const tilt = grounded ? 0.07 * stride : Math.max(-0.45, Math.min(0.7, chick.vy / 900));
  const bodyY = -3 - bob + r * squat;
  ctx.save();
  ctx.translate(chick.x, chick.y);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  // During stance the toes sweep back along the surface. On the return
  // stroke they lift, with the far leg half a cycle ahead of the near leg.
  for (let leg = 0; leg < 2; leg++) {
    const hip = leg === 0 ? -5 : 4;
    const angle = phase + leg * Math.PI;
    const lift = stride * Math.max(0, Math.cos(angle));
    const ankleX = grounded ? hip + stride * 9 * Math.sin(angle) : hip - 5;
    const toeY = grounded ? r - 1 - 6 * lift : r - 3;
    ctx.strokeStyle = leg === 0 ? '#ad713c' : '#dd932e';
    ctx.lineWidth = 2.6;
    ctx.beginPath();
    ctx.moveTo(hip, bodyY + 10);
    ctx.quadraticCurveTo(hip - 2, toeY - 4, ankleX, toeY);
    ctx.lineTo(ankleX + (grounded ? 4.5 : 3), toeY - lift);
    ctx.stroke();
  }
  ctx.translate(0,bodyY);
  ctx.rotate(tilt);
  ctx.scale(1 + squat * 0.12 - stretch * 0.18, 1 - squat + stretch);
  const wingLift = grounded ? 0 : .38 + .76 * Math.sin(tick * CFG.TICK * Math.PI * 7);
  paintBird(wingLift);
  ctx.restore();
}

function drawChargeBar() {
  if (st !== 'play') return;
  if (!(charging || grounded)) return;
  if (!charging && charge <= 0) return;
  const bw = 64, bh = 8;
  const sx = chick.x - bw / 2;
  const sy = chick.y - CFG.CHICKEN_R - 22;
  ctx.save();
  roundRect(sx - 1, sy - 1, bw + 2, bh + 2, 5);
  ctx.fillStyle = '#24483c';

  roundRect(sx, sy, bw, bh, 4);
  ctx.fillStyle = '#fff';

  if (t > 0) {
    ctx.save();
    ctx.beginPath();
    roundRect(sx, sy, bw, bh, 4);
    ctx.clip();
    ctx.fillStyle = t >= 1 ? '#ffa847' : '#80c693';
    ctx.fillRect(sx, sy, bw * t, bh);

  if (t >= 1) {

    roundRect(chick.x - 18, sy - 20, 36, 17, 8); ctx.fill();
    ctx.fillStyle = '#fff8dc';
    ctx.font = 'bold 11px '+UI_FONT;
    ctx.textAlign = 'center';

}

function sceneBg() {
  const pal = weather ? weather.palette : 'earth';
  if (pal === 'moon') return '#070b18';
  if (pal === 'mars') return '#c86a3a';
  if (pal === 'storm') return '#5a6876';
  if (pal === 'snow' || pal === 'ice') return '#e4eef6';
  if (pal === 'hot') return '#e8d090';
  if (typeof isDarkSky === 'function' && isDarkSky()) return '#101828';
  return '#9ad8f5';
}
function syncSceneChrome() {
  const bg = sceneBg();
  const dark = (weather && weather.palette === 'moon') || (typeof isDarkSky === 'function' && isDarkSky());
  const root = document.documentElement;

  const bar = document.getElementById('placeBar');

function cityFromGeo(j) {
  if (!j || typeof j !== 'object') return '';
  return j.city || j.locality || j.localityInfo && j.localityInfo.administrative && j.localityInfo.administrative[0] && j.localityInfo.administrative[0].name || j.principalSubdivision || j.countryName || '';
}
function reverseGeocode(lat, lon) {
  const url = 'https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=' +
    encodeURIComponent(lat) + '&longitude=' + encodeURIComponent(lon) + '&localityLanguage=zh-Hant';
  return fetch(url).then(function (res) {
    if (!res.ok) throw new Error('geocode');
    return res.json();
  }).then(function (j) {
    const name = cityFromGeo(j);
    if (!name) throw new Error('empty');
    return name;
  }).catch(function () {
    const url2 = 'https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=' +
      encodeURIComponent(lat) + '&lon=' + encodeURIComponent(lon) + '&accept-language=zh-TW';
    return fetch(url2, { headers: { 'Accept': 'application/json' } }).then(function (res) {
      if (!res.ok) throw new Error('geocode2');
      return res.json();
    }).then(function (j) {
      const a = j && j.address || {};
      const name = a.city || a.town || a.village || a.suburb || a.county || a.state || (j && j.name) || '';
      if (!name) throw new Error('empty2');
      return name;
    });
  });
}
function requestPlace() {
  if (!navigator.geolocation) {
    locState.status = 'unsupported';
    locState.fromGeo = false;
    locState.label = tzPlaceName(DEVICE_TZ);
    locState.msg = '此環境無法定位，已用時區顯示地區';
    syncSceneChrome();
    return;
  }
  locState.status = 'asking';
  locState.msg = '定位中…';
  syncSceneChrome();
  let settled = false;
  const finish = function (fn) { if (settled) return; settled = true; fn(); };
  try {
    navigator.geolocation.getCurrentPosition(function (pos) {
      const lat = pos && pos.coords && pos.coords.latitude;
      const lon = pos && pos.coords && pos.coords.longitude;
      reverseGeocode(lat, lon).then(function (name) {
        finish(function () {
          locState.status = 'ok';
          locState.fromGeo = true;
          locState.label = name;
          locState.msg = '';
          syncSceneChrome();
        });
      }).catch(function () {
        finish(function () {
          locState.status = 'error';
          locState.fromGeo = false;
          locState.label = tzPlaceName(DEVICE_TZ);
          locState.msg = '找不到城市名稱，已用時區顯示地區';
          syncSceneChrome();
        });
      });
    }, function (err) {
      finish(function () {
        locState.status = (err && err.code === 1) ? 'denied' : 'error';
        locState.fromGeo = false;
        locState.label = tzPlaceName(DEVICE_TZ);
        locState.msg = locState.status === 'denied'
          ? '未授權定位，已用時區顯示地區'
          : '無法取得位置，已用時區顯示地區';
        syncSceneChrome();
      });
    }, { enableHighAccuracy: false, timeout: 8000, maximumAge: 0 });
  } catch (e) {
    locState.status = 'unsupported';
    locState.fromGeo = false;
    locState.label = tzPlaceName(DEVICE_TZ);
    locState.msg = '此環境無法定位，已用時區顯示地區';
    syncSceneChrome();
  }
}

function wrapLines(text, maxW) {
  const chars = String(text || '');
  const lines = [];
  let line = '';
  for (let i = 0; i < chars.length; i++) {
    const t = line + chars[i];
    if (line && ctx.measureText(t).width > maxW) {
      lines.push(line);
      line = chars[i];
    } else line = t;
  }
  if (line) lines.push(line);
  return lines.length ? lines : [''];
}
function drawHills(period, yFoot, color, ridges, parallax, cx, width) {

  ctx.beginPath();
  const start = shift - period;
  ctx.moveTo(start, yFoot);
  const copies = Math.ceil((width - start) / period) + 2;
  for (let k = 0; k < copies; k++) {

  ctx.lineTo(start, yFoot);

function drawHillSnowCaps(period, ridges, parallax, cx, width) {
  const shift = -((cx * parallax) % period + period) % period;
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  const copies = Math.ceil((width - (shift - period)) / period) + 2;
  for (let k = 0; k < copies; k++) {
    const ox = shift + (k - 1) * period;
    for (let i = 1; i < ridges.length - 1; i++) {
      const x = ox + ridges[i][0], y = ridges[i][1];
      const prev = ridges[i - 1], next = ridges[i + 1];
      if (y >= prev[1] - 2 && y >= next[1] - 2) continue; // 非峰
      ctx.beginPath();
      ctx.moveTo(ox + prev[0] + (ridges[i][0] - prev[0]) * 0.45, prev[1] + (y - prev[1]) * 0.45);
      ctx.lineTo(x, y + 1);
      ctx.lineTo(ox + next[0] + (ridges[i][0] - next[0]) * 0.45, next[1] + (y - next[1]) * 0.45);
      ctx.closePath();
      ctx.fill();

  ctx.beginPath();
  const start = shift - period;
  ctx.moveTo(start, yFoot);
  const copies = Math.ceil((width - start) / period) + 2;
  for (let k = 0; k < copies; k++) {
    const ox = shift + (k - 1) * period;
    ctx.lineTo(ox, yFoot - amp * 0.25);
    ctx.quadraticCurveTo(ox + period * 0.25, yFoot - amp, ox + period * 0.5, yFoot - amp * 0.4);
    ctx.quadraticCurveTo(ox + period * 0.72, yFoot - amp * 0.15, ox + period, yFoot - amp * 0.5);
  }
  ctx.lineTo(start + copies * period, yFoot);
  ctx.lineTo(start, yFoot);
  ctx.closePath();
  ctx.fill();
}

}

function loop(ts) {
  const frameDt = Math.min(0.05, ((ts - lastTs) / 1000) || 0);
  lastTs = ts;
  if (frameDt > 0 && frameDt < 0.1) noteFrame(frameDt);
  acc += frameDt;
  let n = 0;
  while (acc >= CFG.TICK && n < 5) {
    step(CFG.TICK);
    acc -= CFG.TICK;
    n++;
  }
  if (n >= 5) acc = 0;
  updateShake(frameDt);
  updateFx(frameDt);
  updateWx(frameDt);
  draw();
  requestAnimationFrame(loop);
}

// 供 headless 驗證使用
function slideOnGround(x, vx, dt) {
  const env = envAt(x);
  const gGround = CFG.GRAVITY * env.gMul;
  const aFric = Math.max(0, env.mu) * gGround;
  const tgt = CFG.RUN_SPEED;
  const dv = tgt - vx;
  const cap = aFric * dt;
  if (Math.abs(dv) <= cap) vx = tgt;
  else vx += (dv > 0 ? 1 : -1) * cap;
  return { x: x + vx * dt, vx: vx };
}
function runOnlyTo(x, vx, seconds, edge) {
  const dt = CFG.TICK;
  let t = 0, auto = false;
  const cap = seconds < 0 ? 0 : seconds;
  while (t < cap - 1e-9) {
    const s = slideOnGround(x, vx, dt);
    x = s.x; vx = s.vx;
    t += dt;
    if (x >= edge) { auto = true; x = edge; break; }
  }
  return { x: x, vx: vx, t: t, auto: auto };
}
function timeToEdge(x, vx, edge) {
  return runOnlyTo(x, vx, 8, edge);
}
function runChargeTo(x, vx, chargeTime, edge) {
  const dt = CFG.TICK;
  let charge = 0, charged = 0, auto = false;
  while (charged < chargeTime - 1e-9) {
    const s = slideOnGround(x, vx, dt);
    x = s.x; vx = s.vx;
    charged += dt;
    charge = Math.min(1, charge + dt * (1000 / CFG.CHARGE_MS));
    if (x >= edge) { auto = true; x = edge; break; }
  }
  return { x: x, vx: vx, charge: charge, auto: auto, charged: charged };
}
function humanJumpOk(charge, x, y, vx, next) {
  const jmp = window.__BAIJI__
    ? window.__BAIJI__.simJumpTo(charge, x, y, vx, next.y)
    : simJumpTo(charge, x, y, vx, next.y);
  const ok = !!(jmp.landed && jmp.x + 8 >= next.x && jmp.x - 8 <= next.x + next.w);
  return { ok: ok, jmp: jmp };
}
function tryHumanCharge(x, vx, y, edge, next, chargeTime) {
  // 台夠長時先跑到「剛好蓄完就到台緣」，需要短跳時就先跑再輕點
  const arrive = timeToEdge(x, vx, edge);
  let sx = x, sv = vx;
  if (chargeTime < arrive.t - 1e-9) {
    const wait = arrive.t - chargeTime;
    const ran = runOnlyTo(x, vx, wait, edge);
    sx = ran.x; sv = ran.vx;
  }
  const run = runChargeTo(sx, sv, chargeTime, edge);
  const r = humanJumpOk(run.charge, run.x, y, run.vx, next);
  return { ok: r.ok, jmp: r.jmp, x: run.x, vx: run.vx, charge: run.charge, auto: run.auto, waited: chargeTime < arrive.t - 1e-9 };
}
function pickHumanCharge(x, vx, y, edge, next) {
  const goods = [];
  for (let k = 0; k <= 20; k++) {
    const c = k / 20;
    const r = tryHumanCharge(x, vx, y, edge, next, c * (CFG.CHARGE_MS / 1000));
    if (r.ok) goods.push(c);
  }
  if (!goods.length) return null;
  const err = CFG.HUMAN_CHARGE_ERR_S || 0.08;
  let best = goods[(goods.length / 2) | 0], bestScore = -1;
  for (let i = 0; i < goods.length; i++) {
    const c = goods[i];
    let score = 0;
    for (let e = 0; e < 3; e++) {
      const dtErr = (e - 1) * err;
      const r = tryHumanCharge(x, vx, y, edge, next, Math.max(0, c * (CFG.CHARGE_MS / 1000) + dtErr));
      if (r.ok) score++;
    }
    if (score > bestScore) { bestScore = score; best = c; }
  }
  return best;
}

function checkHuman(seed, weatherId, n, opts) {
  opts = opts || {};
  const reactionS = opts.reactionS != null ? opts.reactionS : CFG.REACTION_S;
  const chargeErr = opts.chargeErr != null ? opts.chargeErr : 0;
  const saved = {
    rng: rngState, weather: weather, plats: plats, next: nextPlatId, camX: camX,
    wxParts: wxParts, wxStars: wxStars
  };
  initWeather(seed, weatherId);
  rngState = seed;
  plats = [];
  nextPlatId = 1;
  const startX = 80;
  plats.push({ id: nextPlatId++, x: 0, y: CFG.START_Y, w: startPlatformWidth(), kind: 'start' });
  const keep = CFG.LOOKAHEAD;
  const keepCam = camX;
  camX = -1e9;
  CFG.LOOKAHEAD = Math.max(keep, (n || 10) + 1);
  ensurePlats();
  CFG.LOOKAHEAD = keep;
  camX = keepCam;
  const list = plats.slice().sort((a, b) => a.id - b.id);
  const dt = CFG.TICK;
  const R = CFG.CHICKEN_R;
  let x = startX, vx = CFG.RUN_SPEED;
  const jumps = [];
  let okAll = true;
  const limit = Math.min((n || 10), list.length - 1);
  for (let i = 0; i < limit; i++) {
    const plat = list[i];
    const next = list[i + 1];
    const edge = plat.x + plat.w - 8;
    const y = plat.y - R;
    const rec = {
      from: plat.id, to: next.id, kind: next.kind || '',
      w: plat.w, nextW: next.w, gap: next.x - (plat.x + plat.w),
      dy: plat.y - next.y, landX: x, landVx: vx, ok: false, why: ''
    };
    rec.usable = edge - x;
    if (x < plat.x - 8 || x > plat.x + plat.w + 8) {
      rec.why = 'not-on-plat';
      jumps.push(rec); okAll = false; break;
    }
    let tReact = 0, leftEdge = false;
    while (tReact < reactionS) {
      const sld = slideOnGround(x, vx, dt);
      x = sld.x; vx = sld.vx; tReact += dt;
      if (x >= edge) { leftEdge = true; break; }
    }
    if (leftEdge) {
      const r = humanJumpOk(0, edge, y, vx, next);
      rec.ok = r.ok; rec.charge = 0; rec.takeoffX = edge;
      rec.why = rec.ok ? 'coyote' : 'ran-off-during-reaction';
      rec.auto = true;
      jumps.push(rec);
      if (!rec.ok) { okAll = false; break; }
      x = r.jmp.x; vx = r.jmp.vx != null ? r.jmp.vx : CFG.RUN_SPEED;
      continue;
    }
    const xAfterReact = x, vxAfterReact = vx;
    rec.reactLeft = edge - xAfterReact;
    const intended = pickHumanCharge(x, vx, y, edge, next);
    if (intended == null) {
      rec.why = 'no-charge-works-after-reaction';
      rec.takeoffX = x;
      jumps.push(rec); okAll = false; break;
    }
    const chargeTime = Math.max(0, intended * (CFG.CHARGE_MS / 1000) + chargeErr);
    const trial = tryHumanCharge(xAfterReact, vxAfterReact, y, edge, next, chargeTime);
    rec.ok = trial.ok;
    rec.charge = trial.charge;
    rec.intended = intended;
    rec.takeoffX = trial.x;
    rec.auto = trial.auto;
    rec.why = rec.ok ? (trial.auto ? 'auto-jump' : 'release') : (trial.auto ? 'auto-jump-miss' : 'release-miss');
    jumps.push(rec);
    if (!rec.ok) { okAll = false; break; }
    x = trial.jmp.x;
    vx = trial.jmp.vx != null ? trial.jmp.vx : CFG.RUN_SPEED;
  }
  const result = {
    ok: okAll, weather: weather.id, seed: seed, reactionS: reactionS, chargeErr: chargeErr,
    jumps: jumps, platCount: list.length,
    plats: list.slice(0, limit + 1).map(function (p) {
      return { id: p.id, x: p.x, y: p.y, w: p.w, kind: p.kind || 'start' };
    })
  };
  rngState = saved.rng;
  weather = saved.weather;
  plats = saved.plats;
  nextPlatId = saved.next;
  camX = saved.camX;
  wxParts = saved.wxParts;
  wxStars = saved.wxStars;
  return result;
}

function hideContinueBtn() {
  adContinueOffered = false;
  const btn = document.getElementById('adContinueBtn');
  if (btn) btn.classList.remove('visible');
}
function showContinueBtn() {
  adContinueOffered = true;
  const btn = document.getElementById('adContinueBtn');
  if (btn) btn.classList.add('visible');
}
function pauseForAd() {
  adsPaused = true;
  adsSoundMuted = true;
  applyAudioMute();
  charging = false;
  pendingRestart = false;
  if (typeof window.adConfig === 'function' && adsUseGoogle()) {
    try { window.adConfig({ sound: 'off' }); } catch (e) {}
  }
}
function resumeAfterAd() {
  adsPaused = false;
  adsSoundMuted = false;
  hideFakeAd();
  applyAudioMute();
  if (typeof window.adConfig === 'function' && adsUseGoogle()) {
    try { window.adConfig({ sound: 'off' }); } catch (e) {}
  }
}
function hideFakeAd() {
  if (fakeAdTimer) { clearTimeout(fakeAdTimer); fakeAdTimer = 0; }
  const el = document.getElementById('adFake');
  if (el) el.classList.remove('visible');
}
function showFakeAd(kind, note) {
  const el = document.getElementById('adFake');
  const title = document.getElementById('adFakeTitle');
  const noteEl = document.getElementById('adFakeNote');
  const view = document.getElementById('adFakeView');
  const skip = document.getElementById('adFakeSkip');
  const close = document.getElementById('adFakeClose');
  if (title) title.textContent = kind === 'reward' ? '測試廣告（接續本局）' : '測試廣告（兩局之間）';
  if (noteEl) noteEl.textContent = note || '這是本機模擬，沒有向 Google 發送請求。';
  if (view) view.hidden = kind !== 'reward';
  if (skip) skip.hidden = kind !== 'reward';
  if (close) close.hidden = kind === 'reward';
  if (el) el.classList.add('visible');
}
function placementInfo(opts, status) {
  return {
    breakType: opts.type,
    breakName: opts.name || '',
    breakFormat: opts.type === 'reward' ? 'reward' : 'interstitial',
    breakStatus: status
  };
}
function finishAdBreak(opts, status) {
  const info = placementInfo(opts, status);
  lastPlacementInfo = info;
  try {
    if (typeof opts.adBreakDone === 'function') opts.adBreakDone(info);
  } catch (e) {
    console.warn('[ads]', e);
  }
}
function runFakeAd(opts) {
  if (opts.type === 'reward') {
    if (typeof opts.beforeReward !== 'function') {
      finishAdBreak(opts, 'other');
      return;
    }
    opts.beforeReward(function showAdFn() {
      pauseForAd();
      if (typeof opts.beforeAd === 'function') opts.beforeAd();
      showFakeAd('reward');
      const view = document.getElementById('adFakeView');
      const skip = document.getElementById('adFakeSkip');
      function done(viewed) {
        hideFakeAd();
        if (viewed) {
          if (typeof opts.adViewed === 'function') opts.adViewed();
        } else if (typeof opts.adDismissed === 'function') {
          opts.adDismissed();
        }
        if (typeof opts.afterAd === 'function') opts.afterAd();
        finishAdBreak(opts, viewed ? 'viewed' : 'dismissed');
      }
      if (view) view.onclick = function (ev) { ev.preventDefault(); ev.stopPropagation(); done(true); };
      if (skip) skip.onclick = function (ev) { ev.preventDefault(); ev.stopPropagation(); done(false); };
    });
    return;
  }
  // interstitial / next
  pauseForAd();
  if (typeof opts.beforeAd === 'function') opts.beforeAd();
  showFakeAd('next');
  const minMs = Math.max(400, CFG.ADS_FAKE_MS || 1400);
  const opened = Date.now();
  function closeNext() {
    if (Date.now() - opened < minMs - 20) {
      fakeAdTimer = setTimeout(closeNext, minMs - (Date.now() - opened));
      return;
    }
    hideFakeAd();
    if (typeof opts.afterAd === 'function') opts.afterAd();
    finishAdBreak(opts, 'viewed');
  }
  const close = document.getElementById('adFakeClose');
  if (close) close.onclick = function (ev) { ev.preventDefault(); ev.stopPropagation(); closeNext(); };
  fakeAdTimer = setTimeout(closeNext, minMs);
}
function safeAdBreak(opts) {
  opts = opts || {};
  if (!adsWanted()) {
    finishAdBreak(opts, 'ignored');
    return;
  }
  if (FAKE_AD) {
    runFakeAd(opts);
    return;
  }
  const fn = window.adBreak;
  if (typeof fn !== 'function') {
    finishAdBreak(opts, 'notReady');
    return;
  }
  try {
    fn({
      type: opts.type,
      name: opts.name,
      beforeAd: opts.beforeAd,
      afterAd: opts.afterAd,
      beforeReward: opts.beforeReward,
      adDismissed: opts.adDismissed,
      adViewed: opts.adViewed,
      adBreakDone: function (info) {
        lastPlacementInfo = info || placementInfo(opts, 'other');
        try {
          if (typeof opts.adBreakDone === 'function') opts.adBreakDone(lastPlacementInfo);
        } catch (e) {
          console.warn('[ads]', e);
        }
      }
    });
  } catch (e) {
    console.warn('[ads]', e);
    finishAdBreak(opts, 'error');
  }
}
function installAdsTag() {
  if (window.__BAIJI_ADS_TAG__ || !adsUseGoogle()) return;
  window.adsbygoogle = window.adsbygoogle || [];
  // 官方樣板：https://developers.google.com/ad-placement/docs/html5-game-structure
  window.adBreak = window.adConfig = function (o) { window.adsbygoogle.push(o); };
  const s = document.createElement('script');
  s.async = true;
  const client = (CFG.ADS_CLIENT || '').trim();
  s.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js' +
    (client ? ('?client=' + encodeURIComponent(client)) : '');
  if (client) s.setAttribute('data-ad-client', client);
  // 尚無正式帳號，或 CFG.ADS_TEST_MODE 時一律走測試模式，不請求正式廣告
  if (CFG.ADS_TEST_MODE || !client) s.setAttribute('data-adbreak-test', 'on');
  s.crossOrigin = 'anonymous';
  document.head.appendChild(s);
  window.__BAIJI_ADS_TAG__ = true;
  try {
    window.adConfig({
      preloadAdBreaks: 'on',
      sound: 'off',
      onReady: function () {}
    });
  } catch (e) {}
}
function offerRewardContinue() {
  hideContinueBtn();
  pendingShowAdFn = null;
  rewardGranted = false;
  if (continueUsed || !adsWanted()) return;
  safeAdBreak({
    type: 'reward',
    name: 'continue-run',
    beforeReward: function (showAdFn) {
      pendingShowAdFn = showAdFn;
      showContinueBtn();
    },
    beforeAd: pauseForAd,
    afterAd: resumeAfterAd,
    adDismissed: function () {
      rewardGranted = false;
      hideContinueBtn();
    },
    adViewed: function () {
      rewardGranted = true;
    },
    adBreakDone: function (info) {
      lastPlacementInfo = info;
      resumeAfterAd();
      pendingShowAdFn = null;
      if (rewardGranted && !continueUsed) {
        rewardGranted = false;
        hideContinueBtn();
        continueAfterReward();
        return;
      }
      hideContinueBtn();
    }
  });
}
function clickContinueAd() {
  if (!pendingShowAdFn || continueUsed || adsPaused) return false;
  const fn = pendingShowAdFn;
  pendingShowAdFn = null;
  hideContinueBtn();
  fn();
  return true;
}
function safePlatForContinue() {
  const id = lastSafePlatId || onPlatId || 1;
  let plat = plats.find(function (p) { return p.id === id; });
  if (!plat && lastSafePlatSnap) {
    plat = {
      id: lastSafePlatSnap.id,
      x: lastSafePlatSnap.x,
      y: lastSafePlatSnap.y,
      w: lastSafePlatSnap.w,
      kind: lastSafePlatSnap.kind || ''
    };
    plats.push(plat);
    plats.sort(function (a, b) { return a.id - b.id; });
    if (nextPlatId <= plat.id) nextPlatId = plat.id + 1;
  }
  return plat || plats[0];
}
function continueAfterReward() {
  const plat = safePlatForContinue();
  if (!plat) {
    reset();
    startCountdown();
    return;
  }
  continueUsed = true;
  adContinueOffered = false;
  hideContinueBtn();
  const inset = Math.min(Math.max(40, plat.w * 0.22), Math.max(16, plat.w - 24));
  chick.x = plat.x + inset;
  chick.y = plat.y - CFG.CHICKEN_R;
  chick.vy = 0;
  chick.vx = CFG.RUN_SPEED;
  grounded = true;
  onPlatId = plat.id;
  lastSafePlatId = plat.id;
  charging = false;
  charge = 0;
  chargedFull = false;
  bufferedJump = false;
  tOver = 0;
  pendingRestart = false;
  trauma = 0;
  squashT = 0;
  stretchT = 0;
  ignoreHoldUntilRelease = isHeld();
  updateCam();
  ensurePlats();
  if (typeof syncSceneChrome === 'function') syncSceneChrome();
  startCountdown();
}
function restartAfterGame() {
  hideContinueBtn();
  pendingShowAdFn = null;
  adCompletedRuns = (adCompletedRuns || 0) + 1;
  const every = Math.max(1, CFG.ADS_INTERSTITIAL_EVERY || 3);
  const due = adsWanted() && (adCompletedRuns % every === 0);
  function go() {
    resumeAfterAd();
    reset();
    startCountdown();
  }
  if (!due) {
    go();
    return;
  }
  let started = false;
  function goOnce() {
    if (started) return;
    started = true;
    go();
  }
  safeAdBreak({
    type: 'next',
    name: 'next-run',
    beforeAd: pauseForAd,
    afterAd: resumeAfterAd,
    adBreakDone: function (info) {
      lastPlacementInfo = info;
      goOnce();
    }
  });
}
function initAds() {
  adCompletedRuns = adCompletedRuns || 0;
  adsPaused = false;
  adsSoundMuted = false;
  if (typeof applyAudioMute === 'function') applyAudioMute();
  continueUsed = !!continueUsed;
  hideContinueBtn();
  hideFakeAd();
  const btn = document.getElementById('adContinueBtn');
  if (btn) {
    btn.addEventListener('pointerdown', function (ev) { ev.stopPropagation(); });
    btn.addEventListener('click', function (ev) {
      ev.preventDefault();
      ev.stopPropagation();
      clickContinueAd();
    });
  }
  ['adFakeView', 'adFakeSkip', 'adFakeClose'].forEach(function (id) {
    const el = document.getElementById(id);
    if (el) el.addEventListener('pointerdown', function (ev) { ev.stopPropagation(); });
  });
  if (adsUseGoogle()) installAdsTag();
}

function onViewportChange() {
  layout();
}
window.addEventListener('resize', onViewportChange);
window.addEventListener('orientationchange', onViewportChange);
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', onViewportChange);
  window.visualViewport.addEventListener('scroll', onViewportChange);
}

syncVibUi();
layout();
initWeather(SEED0);
reset();
syncSceneChrome();
initAds();
requestAnimationFrame(loop);
</script>
</body>
